<!doctype html>
<html lang="pt-BR" class="splash-active">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#FFFDF7">

  <meta
    name="description"
    content="Crediti IA - Assistente inteligente da Crediti"
  >

  <title>Crediti IA</title>

  <!-- Ícone padrão dos navegadores -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/icon-192.png?v=2"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="/icon-512.png?v=2"
  >

  <!-- Ícone para iPhone e iPad -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png?v=2"
  >

  <!-- Configuração do aplicativo -->
  <link
    rel="manifest"
    href="/manifest.webmanifest"
  >

  <!-- Configurações para iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Crediti IA"
  >

  <!-- Configurações para Android / PWA -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >
</head>

<body>
  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>
</body>
</html>
