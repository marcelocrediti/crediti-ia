    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const secondaryScripts = [
          '/creator-ads-preview.js?v=20260904-6',
          '/creator-ads-home-card-cleanup.js?v=20260904-1',
          '/creator-ads-upload-meus-videos.js?v=20260904-2',
          '/creator-ads-video-status.js?v=20260904-2',
          '/creator-ads-placement.js?v=20260904-3',
          '/creator-ads-campaign-organizer.js?v=20260904-1',
          '/shopee-affiliate-link.js?v=20260904-2',
          '/employment-opportunities.js?v=20260907-1'
        ];
        let started = false;

        function loadScriptSequentially(index) {
          if (index >= secondaryScripts.length) return;
          const script = document.createElement('script');
          script.src = secondaryScripts[index];
          script.async = false;
          script.onload = () => loadScriptSequentially(index + 1);
          script.onerror = () => loadScriptSequentially(index + 1);
          document.body.appendChild(script);
        }

        function loadSecondaryScripts() {
          if (started) return;
          started = true;
          loadScriptSequentially(0);
        }

        function scheduleSecondaryScripts() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadSecondaryScripts, { timeout: 2500 });
          } else {
            setTimeout(loadSecondaryScripts, 1200);
          }
        }

        if (document.readyState === 'complete') scheduleSecondaryScripts();
        else window.addEventListener('load', scheduleSecondaryScripts, { once: true });
      })();
    </script>
  </body>
