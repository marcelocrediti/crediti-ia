<style>
  #app.wrap:has(>.cdc-login-screen){max-width:none;width:100%;padding:0;margin:0;}
  .cdc-login-screen{min-height:100svh;width:100%;display:flex;align-items:center;justify-content:center;padding:200px 20px 48px;background-color:#083c36;background-size:cover;background-position:center 28%;position:relative;}
  .cdc-login-panel{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 24px 80px #001c3860;border:1px solid #ffffff80;border-top:5px solid #f5c800;color:#14364b;}
  .cdc-login-logo{position:absolute;top:max(20px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));width:64px;height:64px;object-fit:cover;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 14px #001c3840;}
  .cdc-login-kicker{display:block;font-size:11px;letter-spacing:2px;font-weight:800;color:#16805b;margin-bottom:12px;}
  .cdc-login-panel h1{font-size:32px;line-height:1.15;letter-spacing:-1px;margin:0 0 10px;color:#073b33;}
  .cdc-login-panel .cdc-login-intro{font-size:14px;line-height:1.6;color:#60717a;margin:0 0 26px;}
  .cdc-login-panel label{display:block;font-size:14px;font-weight:700;margin:18px 0 8px;color:#183d50;}
  .cdc-login-panel input{display:block;width:100%;min-width:0;height:54px;margin:0;padding:0 15px;font:inherit;font-size:16px;color:#14364b;border:1px solid #ccd9df;border-radius:12px;background:#f7fafb;box-sizing:border-box;}
  .cdc-login-panel input:focus{outline:3px solid #1b97612b;outline-offset:1px;border-color:#16805b;}
  .cdc-login-password{position:relative;}
  .cdc-login-password input{padding-right:86px;}
  .cdc-login-panel #cdc-eye{position:absolute;right:5px;top:5px;width:76px;height:44px;padding:0;border:0;border-radius:8px;background:transparent;color:#12664c;font-size:12px;font-weight:700;cursor:pointer;}
  .cdc-login-panel #cdc-enter{width:100%;height:54px;margin:24px 0 0;border:0;border-radius:12px;background:#087549;color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px #08754926;}
  .cdc-login-panel #cdc-enter:hover{background:#055b39;}
  .cdc-login-panel #cdc-reset{display:block;width:100%;min-height:44px;margin:10px 0 0;padding:10px;border:0;background:transparent;color:#194b77;font-size:14px;font-weight:600;cursor:pointer;}
  .cdc-login-panel button:focus-visible{outline:3px solid #e5b900;outline-offset:3px;}
  .cdc-login-panel button:disabled{opacity:.6;cursor:wait;}
  .cdc-login-panel #cdc-login-message{font-size:14px;line-height:1.5;color:#983b22;margin:12px 0 0;overflow-wrap:anywhere;}
  .cdc-login-panel #cdc-login-message:empty{display:none;}
  .cdc-login-footer{font-size:11px;line-height:1.5;color:#78868e;text-align:center;border-top:1px solid #e7edf0;padding-top:18px;margin:18px 0 0;}
  @media(min-width:800px){.cdc-login-screen{justify-content:flex-end;padding:64px max(7vw,40px);background-position:center 12%;}.cdc-login-panel{padding:36px;}}
  @media(max-width:380px){.cdc-login-screen{padding:150px 16px 32px;}.cdc-login-panel{padding:24px;}.cdc-login-panel h1{font-size:28px;}}

<style>
  :root{
    --gold:#f7b500;
    --gold-deep:#e29b00;
    --ink:#141414;
    --ink-soft:#3a3a3a;
    --paper:#fffaf0;
    --card:#ffffff;
    --line:#ecdfc0;
    --ok:#1c7c3f;
    --ok-bg:#e8f5ec;
    --warn:#8a5a00;
    --warn-bg:#fff3d6;
    --danger:#b3261e;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;}
  body{
    margin:0;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#fff8e6 0%,#fdf3d9 100%);
    color:var(--ink);
    min-height:100vh;touch-action:pan-y;position:relative;
  }
  .wrap{width:100%;max-width:720px;margin:0 auto;padding:18px 16px 60px;overflow-x:clip;}
  .wrap>*{min-width:0;max-width:100%;}
  #detalhe,.card,.result-box,.result-section{min-width:0;max-width:100%;}
  header.top{
    display:flex;align-items:center;gap:12px;
    padding:14px 4px 20px;
  }
  header.top img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  header.top img{flex:0 0 46px;}
  header.top>div{min-width:0;flex:1;overflow-wrap:anywhere;}
  header.top .brand-name{font-weight:800;font-size:20px;letter-spacing:.2px;}
  header.top .brand-sub{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .tabbar{display:flex;gap:6px;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;}
  .tabbar button{
    flex:1;border:none;background:transparent;padding:10px 6px;border-radius:10px;
    font-weight:700;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
  }
  .tabbar button.active{background:var(--ink);color:var(--gold);}
  select{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;background:#fffdf7;color:var(--ink);
  }
  select:focus{outline:none;border-color:var(--gold-deep);}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px;margin-bottom:16px;box-shadow:0 3px 14px rgba(60,40,0,.06);
  }
  .card h2{margin:0 0 4px;font-size:17px;}
  .card .hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px;}
  input[type=text],input[type=number],input[type=date]{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    min-width:0;max-width:100%;font-size:15px;background:#fffdf7;color:var(--ink);
  }
  input[type=file]{display:block;width:100%;min-width:0;max-width:100%;overflow:hidden;}
  input:focus{outline:none;border-color:var(--gold-deep);}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
  .row2>*{min-width:0;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:12px;padding:13px 18px;font-weight:800;font-size:14.5px;
    cursor:pointer;width:100%;margin-top:16px;
  }
  .btn-primary{background:var(--ink);color:var(--gold);}
  .btn-primary:active{transform:scale(.99);}
  .btn-gold{background:var(--gold);color:var(--ink);}
  .btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-sm{width:auto;padding:9px 14px;font-size:13px;margin-top:0;}
  .result-box{
    background:#fffaeb;border:1.5px dashed var(--gold-deep);border-radius:14px;
    padding:16px;margin-top:16px;
  }
  .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dotted #e6d6a8;}
  .kv:last-child{border-bottom:none;}
  .kv b{font-weight:800;}
  .kv span,.kv b{min-width:0;overflow-wrap:anywhere;}
  .kv b{text-align:right;}
  .muted{color:var(--ink-soft);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;}
  .badge-wait{background:var(--warn-bg);color:var(--warn);}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-pending{background:#fde3e0;color:var(--danger);}
  .sim-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .sim-item>div{min-width:0;}
  .sim-item .sub{overflow-wrap:anywhere;}
  .sim-item:last-child{border-bottom:none;}
  .sim-item .nm{font-weight:800;font-size:14.5px;}
  .sim-item .sub{font-size:12px;color:var(--ink-soft);}
  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13.5px;}
  .disclaimer{font-size:11.5px;color:var(--ink-soft);line-height:1.5;background:#f7f3e8;border-radius:10px;padding:10px 12px;margin-top:14px;}
  .link-box{
    display:flex;gap:8px;align-items:center;background:#f2f2f2;border-radius:10px;padding:8px 10px;margin-top:10px;
  }
  .link-box input{border:none;background:transparent;font-size:12.5px;flex:1;min-width:0;width:100%;}
  a.wa-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:#25D366;color:#fff;text-decoration:none;font-weight:800;
    padding:13px 18px;border-radius:12px;margin-top:10px;font-size:14.5px;
  }
  /* client view */
  .client-hero{
    background:linear-gradient(160deg,var(--gold) 0%,var(--gold-deep) 100%);
    border-radius:20px;padding:24px 20px;text-align:center;color:var(--ink);margin-bottom:16px;
  }
  .client-hero img{width:74px;height:74px;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.3);margin-bottom:10px;}
  .client-hero .valor{font-size:32px;font-weight:900;margin:6px 0 0;}
  .client-hero .label{font-size:12px;font-weight:700;opacity:.8;}
  .accept-box{border:2px solid var(--ink);border-radius:14px;padding:14px;margin-top:16px;font-size:13px;line-height:1.5;}
  video{width:100%;height:100%;border-radius:14px;background:#000;object-fit:cover;display:block;}
  #video{transform:scaleX(-1);}
  .cam-wrap{position:relative;margin-top:6px;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:420px;}
  .face-guide{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64%; height:82%;
    border:3px solid rgba(255,255,255,.9);
    border-radius:50% / 42%;
    box-shadow:0 0 0 1000px rgba(0,0,0,.38);
    pointer-events:none;
  }
  canvas{display:none;}
  .cam-preview{width:100%;border-radius:14px;}
  .step-title{font-weight:800;font-size:14.5px;margin:4px 0 10px;}
  .geo-box{background:#f2f2f2;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
  .final-ok{
    background:var(--ok-bg);border:1.5px solid var(--ok);color:var(--ok);
    border-radius:14px;padding:16px;text-align:center;font-weight:700;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--gold);padding:10px 18px;border-radius:30px;
    font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:99;
  }
  .footer-note{text-align:center;font-size:11px;color:#a08b4a;margin-top:24px;}
  .check-row{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#fff8e6;border:1px solid var(--line);border-radius:12px;margin-top:12px;}
  .check-row input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--ink);flex:0 0 auto;}
  .check-row label{margin:0;cursor:pointer;line-height:1.4;}
  .result-highlight{font-size:23px;font-weight:900;color:var(--ok);}
  .result-edit-wrap{padding-top:13px;text-align:center;}
  .result-edit-label{font-size:12px;font-weight:900;color:#3a3a3a;letter-spacing:.2px;}
  .result-edit-input{
    width:100%;margin:8px 0 4px;padding:10px 12px;text-align:center;
    font-size:23px;font-weight:900;color:var(--ok);background:#fff;
    border:2px solid var(--gold-deep);border-radius:11px;
  }
  .result-edit-help{font-size:11px;font-weight:700;color:#6a6a6a;line-height:1.35;}
  .result-section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:12px;}
  .result-section-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.35px;color:var(--warn);margin-bottom:4px;}
  .result-section .kv b{white-space:nowrap;padding-left:10px;}
  .result-section-selected{border:1.5px solid var(--gold-deep);background:#fffdf7;}
  @media(max-width:560px){
    /* Mantém as margens e evita o zoom automático do Safari ao editar campos. */
    .wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));}
    .card{padding:16px;overflow-wrap:anywhere;}
    input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px;min-width:0;max-width:100%;}
    input[type=date]{display:block;appearance:none;-webkit-appearance:none;min-height:44px;}
    input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0;}
    .btn{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;}
    .kv{gap:10px;}
    .kv>span{flex:1 1 55%;}
    .kv>b{flex:0 1 45%;}
    .result-section .kv b{white-space:normal;padding-left:0;}
    .tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden;}
    .tabbar button{min-width:0;white-space:normal;font-size:11.5px;padding:9px 3px;}
    .row2{grid-template-columns:1fr;gap:0;}
  }
</style>

const FAIXAS = [
  { max: 1000,  label: 'Até R$ 1.000',        prazoTexto: 'Até 6 meses',   prazoMax: 6,  taxa: 9  },
  { max: 2000,  label: 'R$ 1.001 a R$ 2.000',  prazoTexto: 'Até 9 meses',   prazoMax: 9,  taxa: 10 },
  { max: 3000,  label: 'R$ 2.001 a R$ 3.000',  prazoTexto: 'Até 12 meses',  prazoMax: 12, taxa: 11 },
  { max: 5000,  label: 'R$ 3.001 a R$ 5.000',  prazoTexto: '13 a 18 meses', prazoMax: 18, taxa: 12 },
  { max: 15000, label: 'R$ 5.001,00 a R$ 15.000,00', prazoTexto: '19 a 60 meses', prazoMax: 60, taxa: 13 },
];
function getFaixa(valor){
  return FAIXAS.find(f => valor <= f.max) || FAIXAS[FAIXAS.length-1];
}

// A taxa sugerida acompanha o prazo escolhido. O campo continua editável,
// mas ao trocar o prazo o sistema reaplica a referência correta da tabela.
function getTaxaSugeridaPorPrazo(prazo){
  const meses = Math.max(CONFIG.prazoMin, Math.min(CONFIG.prazoMax, Number(prazo) || CONFIG.prazoMin));
  if(meses <= 6) return 9;
  if(meses <= 9) return 10;
  if(meses <= 12) return 11;
  if(meses <= 18) return 12;
  return 13;
}

function isDecimoTerceiro(s){

function fmtDate(iso){
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtTimestamp(valor){
  try{
    let data;
    if(valor && typeof valor.toDate === 'function') data = valor.toDate();
    else if(valor && Number.isFinite(Number(valor.seconds))) data = new Date(Number(valor.seconds)*1000);
    else data = new Date(valor);
    return Number.isNaN(data.getTime()) ? 'não informado' : data.toLocaleString('pt-BR');
  }catch(e){ return 'não informado'; }
}
function fmtCoord(valor, casas){
  const numero = Number(valor);
  return Number.isFinite(numero) ? numero.toFixed(casas||5) : 'não informada';
}
function fmtPercentual(valor){
  const numero = Number(valor);
  return Number.isFinite(numero) ? numero.toFixed(2) : '0,00';
}
function addMonths(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1+n, d));
  const yy = dt.getUTCFullYear();
  const mm = String(dt.getUTCMonth()+1).padStart(2,'0');
  const dd = String(dt.getUTCDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
function uid(){
  return 'sim' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

// Número da CCB = sequência do dia + data (ex: 01.04.08.26, 02.04.08.26...)
// O primeiro cliente a formalizar naquele dia recebe 01, o segundo 02, e assim por diante.
// Usa transação do banco pra travar contra duplicidade mesmo se dois clientes assinarem ao mesmo tempo.
const memContadoresCCB = {};
async function gerarNumeroCCB(){
  const hoje = new Date();
  const dd = String(hoje.getDate()).padStart(2,'0');
  const mm = String(hoje.getMonth()+1).padStart(2,'0');
  const yy = String(hoje.getFullYear()).slice(-2);
  const sufixo = `${dd}.${mm}.${yy}`;

  if(!firebaseOk){
    memContadoresCCB[sufixo] = (memContadoresCCB[sufixo] || 0) + 1;
    return `${String(memContadoresCCB[sufixo]).padStart(2,'0')}.${sufixo}`;
  }

  try{
    const ref = db.collection('contadoresCCB').doc(sufixo);
    const novoValor = await db.runTransaction(async (tx)=>{
      const docSnap = await tx.get(ref);
      const atual = docSnap.exists ? (docSnap.data().contador || 0) : 0;
      const novo = atual + 1;
      tx.set(ref, { contador: novo }, { merge: true });
      return novo;
    });
    return `${String(novoValor).padStart(2,'0')}.${sufixo}`;
  }catch(e){
    console.error('Transação do número da CCB falhou, usando contagem simples como reserva:', e);
    let contagemHoje = 0;
    try{
      const todas = await listSims();
      contagemHoje = todas.filter(s => s.numeroCCB && s.numeroCCB.endsWith('.'+sufixo)).length;
    }catch(e2){}
    return `${String(contagemHoje + 1).padStart(2,'0')}.${sufixo}`;
  }
}

}
function whatsDigits(str){

  if(!d) return null;

}

// Telefone no padrão (85)99129-4450
function wireTelefoneMask(input){
  wireIdentificadorMask(input,formatTelefone,'tel',15);
}
function formatCpf(value){
  return String(value||'').replace(/\D/g,'').slice(0,11).replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3}\.\d{3})(\d)/,'$1.$2').replace(/(\.\d{3})(\d)/,'$1-$2');
}
function formatTelefone(value){
  let d=String(value||'').replace(/\D/g,'');
  if((d.length===12||d.length===13)&&d.startsWith('55'))d=d.slice(2);
  d=d.slice(0,11);
  if(d.length<=2)return d?`(${d}`:'';
  const local=d.slice(2),split=d.length===11?5:4;
  return `(${d.slice(0,2)}) `+local.slice(0,split)+(local.length>split?'-'+local.slice(split):'');
}
function wireIdentificadorMask(input,format,inputmode,maxLength){
  if(!input||input.dataset.identificadorMask)return;
  input.dataset.identificadorMask='1';input.type='text';input.inputMode=inputmode;input.maxLength=maxLength;
  const apply=()=>{
    const old=input.value,pos=input.selectionStart??old.length;
    const digitsBefore=old.slice(0,pos).replace(/\D/g,'').length;
    input.value=format(old);
    if(document.activeElement===input){
      let caret=0,seen=0;
      while(caret<input.value.length&&seen<digitsBefore){if(/\d/.test(input.value[caret]))seen++;caret++;}
      if(pos===old.length)caret=input.value.length;
      input.setSelectionRange(caret,caret);
    }
  };
  input.addEventListener('input',apply);input.addEventListener('change',apply);input.addEventListener('blur',apply);apply();
}

// Renda no padrão 1.500,00 (moeda com centavos)
function wireMoedaMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let d = input.value.replace(/\D/g,'');
    if(!d){ input.value=''; return; }
    d = d.padStart(3,'0');
    const centavos = d.slice(-2);
    const inteiro = Number(d.slice(0,-2)).toLocaleString('pt-BR');
    input.value = `${inteiro},${centavos}`;
  });
}

// CEP no padrão 00000-000 + busca automática de endereço (ViaCEP)
// CPF no padrão 000.000.000-00
function wireCpfMask(input){
  wireIdentificadorMask(input,formatCpf,'numeric',14);
}

function wireCepMask(input, onFound){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let d = input.value.replace(/\D/g,'').slice(0,8);
    input.value = d.length > 5 ? `${d.slice(0,5)}-${d.slice(5)}` : d;
  });
  input.addEventListener('blur', async ()=>{
    const digits = input.value.replace(/\D/g,'');
    const statusEl = document.getElementById('cep-status');
    if(digits.length !== 8){ return; }
    if(statusEl) statusEl.textContent = 'Buscando endereço...';
    try{
      const r = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
      const j = await r.json();
      if(j.erro){
        if(statusEl) statusEl.textContent = 'CEP não encontrado — preencha manualmente.';
        return;
      }
      if(statusEl) statusEl.textContent = '✓ Endereço encontrado';
      onFound && onFound({
        rua: j.logradouro || '',
        bairro: j.bairro || '',
        cidade: j.localidade || '',
        uf: j.uf || ''
      });
    }catch(e){
      console.error('Erro ao buscar CEP:', e);
      if(statusEl) statusEl.textContent = 'Não foi possível buscar o CEP agora — preencha manualmente.';
    }
  });
}

function calcParcela(pv, taxaMensalPct, n){
  const i = taxaMensalPct/100;
  if(i <= 0) return pv/n;
  return pv * i / (1 - Math.pow(1+i, -n));
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.style.maxWidth = '90%';
  t.style.textAlign = 'center';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 6000);
}

// Parcelas iguais pelo valor presente nas datas reais, mês financeiro de 30 dias.
function calcularCdcPorDatas(valor, taxa, prazo, dataBase, dataPrimeira, modoCalculo = 'valor'){
  if(!['valor','parcela'].includes(modoCalculo)) throw new Error('Escolha como calcular a simulação.');
  const diaUtc = (iso)=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) throw new Error('Informe uma data válida.');
    const ms = Date.parse(iso + 'T00:00:00Z');
    if(!Number.isFinite(ms) || new Date(ms).toISOString().slice(0,10)!==iso) throw new Error('Informe uma data válida.');
    return ms;
  };
  const inicio = diaUtc(dataBase);
  const primeira = diaUtc(dataPrimeira);
  if(primeira <= inicio) throw new Error('O primeiro vencimento deve ser posterior à data de liberação.');
  if(!Number.isFinite(taxa) || taxa < 1.5) throw new Error('A taxa mínima do crédito pessoal é 1,50% ao mês. Você pode informar uma taxa maior.');
  if(!Number.isFinite(valor) || valor <= 0 ||
     !Number.isInteger(prazo) || prazo < CONFIG.prazoMin || prazo > CONFIG.prazoMax){
    throw new Error('Confira o valor, a taxa e a quantidade de parcelas.');
  }
  const [ano,mes,dia] = dataPrimeira.split('-').map(Number);
  const datasVencimento = Array.from({length:prazo}, (_,k)=>{
    const fimMes = new Date(Date.UTC(ano, mes+k, 0)).getUTCDate();
    return new Date(Date.UTC(ano, mes-1+k, Math.min(dia,fimMes))).toISOString().slice(0,10);
  });
  const diasVencimento = datasVencimento.map(d=>(diaUtc(d)-inicio)/86400000);
  const somaFatores = diasVencimento.reduce((s,d)=>s+Math.pow(1+taxa/100,-d/30),0);
  const parcela = arredondarCentavos(modoCalculo === 'parcela' ? valor : valor/somaFatores);
  const valorLiberado = arredondarCentavos(modoCalculo === 'parcela' ? parcela*somaFatores : valor);
  if(!Number.isFinite(valorLiberado) || valorLiberado <= 0) throw new Error('O valor liberado deve ser maior que zero.');
  if(!Number.isFinite(parcela) || parcela <= 0) throw new Error('Não foi possível calcular. Confira as condições.');
  return {parcela, valorLiberado, modoCalculo, dataBaseCalculo:dataBase, diasAtePrimeira:diasVencimento[0],
    datasVencimento, dataUltima:datasVencimento[prazo-1],
    totalPagar:arredondarCentavos(parcela*prazo), regraCalculo:'cdc_composto_dias_base30'};
}
async function compressImage(dataUrl, maxW){
  return new Promise((res)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const c = document.createElement('canvas');
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = dataUrl;
  });
}

// ---------- Storage wrappers (shared = visible to owner AND client link) ----------
async function criarLinkCDC(s){
  if(!isCdcAdmin())throw new Error('Entre como administrador.');
  if(s.aceite)throw new Error('Esta proposta já está assinada.');
  if(!isDecimoTerceiro(s)){
    const cfg=await db.collection('contadoresCCB').doc('analise_config').get();
    if(s.analiseCdc?.decisao?.status==='Recusada')throw new Error('Ficha recusada. Revise a decisão no painel antes de continuar.');
    if(s.analiseCdc?.decisao?.status!=='Aprovada')throw new Error('Confirme a aprovação da ficha antes de informar o Pix e gerar o link.');
    if(!s.dadosCliente?.pix?.trim())throw new Error('Ficha aprovada. Informe a chave Pix do cliente em Continuar contratação.');
    if(cfg.data()?.automatica){
      if(s.analiseCdc?.decisao?.status!=='Aprovada')throw new Error('Abra a proposta, conclua a análise e confirme a aprovação antes de gerar o link.');
      const {creditSnapshot}=await import('./cdc-review.mjs?v=20261118-modal');
      if(s.analiseCdc.snapshot!==await creditSnapshot(s,{listSims,loadDocumentos}))throw new Error('A ficha mudou. Faça uma nova análise antes de contratar.');
    }
  }
  const token=Array.from(crypto.getRandomValues(new Uint8Array(32))).map(x=>x.toString(16).padStart(2,'0')).join('');
  const proposta={};
  for(const key of ['cliente','valor','prazo','parcela','taxa','cet','dataPrimeira','dataUltima','produto','tipo','salarioBruto','parcela13','inssAplicado'])if(s[key]!==undefined)proposta[key]=s[key];
  const batch=db.batch();
  batch.set(db.collection('assinaturasCDC').doc(token),{proposta,simId:s.id,aceite:null,expiraEm:firebase.firestore.Timestamp.fromMillis(Date.now()+7*86400000)});
  if(s.linkAssinatura)batch.update(db.collection('assinaturasCDC').doc(s.linkAssinatura),{expiraEm:firebase.firestore.Timestamp.fromMillis(0)});
  batch.update(db.collection('simulacoes').doc(s.id),{linkAssinatura:token});
  await batch.commit();return token;
}

async function saveSim(sim){
  if(getRoute().view==='cliente' && /^[a-f0-9]{64}$/.test(sim.id)){
    await db.collection('assinaturasCDC').doc(sim.id).update({aceite:sim.aceite,assinadoEm:firebase.firestore.FieldValue.serverTimestamp()});
    return true;
  }
  if(!firebaseOk){
    memStore[sim.id] = JSON.parse(JSON.stringify(sim));
    return true;
  }
  try{
    const previous=await db.collection('simulacoes').doc(sim.id).get();
    if(previous.exists && previous.data().linkPreanalise){
      const before=previous.data();
      if(['cliente','valor','parcela','prazo','taxa','dataPrimeira','dataUltima','dadosCliente'].some(k=>JSON.stringify(before[k])!==JSON.stringify(sim[k]))){
        await db.collection('preanalisesCDC').doc(before.linkPreanalise).update({estado:'revogado'});
        sim.linkPreanalise=null;
      }else if(!sim.linkPreanalise){sim.linkPreanalise=before.linkPreanalise;}
    }
    if(previous.exists && previous.data().linkAssinatura){
      const before=previous.data();
      const keys=['cliente','valor','parcela','prazo','taxa','dataPrimeira','dataUltima','dadosCliente'];
      if(keys.some(key=>JSON.stringify(before[key])!==JSON.stringify(sim[key])) || (before.aceite && !sim.aceite)){
        await db.collection('assinaturasCDC').doc(before.linkAssinatura).update({expiraEm:firebase.firestore.Timestamp.fromMillis(0)});
        sim.linkAssinatura=null;
      }
    }
    const statusModule=await import('./cdc-status.mjs?v=1');
    await db.runTransaction(async tx=>{
      const ref=db.collection('simulacoes').doc(sim.id),latest=await tx.get(ref);
      const oldConsulta=latest.exists?latest.data().consultaStatusId:null;
      if(oldConsulta){
        const beforeCpf=String(latest.data().dadosCliente?.cpf||'').replace(/\D/g,'');
        const afterCpf=String(sim.dadosCliente?.cpf||'').replace(/\D/g,'');
        if(beforeCpf!==afterCpf){tx.delete(db.collection('consultasCDC').doc(oldConsulta));delete sim.consultaStatusId;}
        else{sim.consultaStatusId=oldConsulta;tx.set(db.collection('consultasCDC').doc(oldConsulta),statusModule.statusRecord(sim,firebase));}
      }else{delete sim.consultaStatusId;}
      tx.set(ref,sim);
    });
    return true;
  }catch(e){
    console.error('Erro saveSim:', e);
    const msg = (e && (e.message || e.toString())) || 'erro desconhecido';
    toast('Erro ao salvar: ' + msg);
    throw e;
  }
}
async function loadSim(id){
  if(getRoute().view==='cliente' && /^[a-f0-9]{64}$/.test(id)){
    try{const link=await db.collection('assinaturasCDC').doc(id).get({source:'server'});if(!link.exists)return null;const d=link.data();if(d.aceite || d.expiraEm.toMillis()<=Date.now())return null;return {...d.proposta,id,aceite:null};}catch{return null;}
  }
  if(!firebaseOk){
    return memStore[id] ? JSON.parse(JSON.stringify(memStore[id])) : null;
  }
  try{
    const doc = await db.collection('simulacoes').doc(id).get();
    if(!doc.exists)return null;
    let data=doc.data();
    if(data.linkPreanalise && isCdcAdmin()){try{const module=await import('./cdc-preanalise.mjs?v=1');data=await module.receiveSubmission(data,{db});}catch(e){toast('Não foi possível receber a pré-análise: '+e.message);}}

    if(data.linkAssinatura && !data.aceite && isCdcAdmin()){
      const link=await db.collection('assinaturasCDC').doc(data.linkAssinatura).get();
      if(link.exists && link.data().aceite){
        const aceite=link.data().aceite;
        const when=link.data().assinadoEm?.toDate()||new Date(aceite.timestamp);
        const parts=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Fortaleza',day:'2-digit',month:'2-digit',year:'2-digit'}).format(when).replaceAll('/','.');
        const ref=db.collection('simulacoes').doc(id),counter=db.collection('contadoresCCB').doc(parts);
        await db.runTransaction(async tx=>{const current=await tx.get(ref);if(current.data().aceite)return;const count=await tx.get(counter);const next=(count.data()?.contador||0)+1;if(!current.data().numeroCCB)tx.set(counter,{contador:next},{merge:true});tx.update(ref,{aceite,numeroCCB:current.data().numeroCCB||String(next).padStart(2,'0')+'.'+parts});});
        data=(await ref.get()).data();
      }
    }
    return data;
  }catch(e){
    console.error('Erro loadSim:', e);
    return null;
  }
}
async function listSims(){
  if(!firebaseOk){
    return Object.values(memStore)
      .map(s=>JSON.parse(JSON.stringify(s)))
      .sort((a,b)=> b.criadoEm - a.criadoEm);
  }
  try{
    const snap = await db.collection('simulacoes').orderBy('criadoEm','desc').get();
    return await Promise.all(snap.docs.map(d=>{const s=d.data();return (s.linkAssinatura||s.linkPreanalise)&&!s.aceite?loadSim(d.id):s;})).then(rows=>rows.filter(Boolean));
  }catch(e){
    console.error('Erro listSims:', e);
    return [];
  }
}

// Documentos (RG/CPF) ficam separados do registro principal da simulação,
// cada um em seu próprio registro — assim um documento grande não estoura
// o limite de tamanho e não trava os outros.
const memDocs = {};
async function saveDocumento(simId, key, data){
  if(!firebaseOk){
    memDocs[simId] = memDocs[simId] || {};
    memDocs[simId][key] = data;
    return true;
  }
  await db.collection('simulacoes').doc(simId).collection('documentos').doc(key).set(data);
  return true;
}
async function loadDocumentos(simId){
  if(!firebaseOk){
    return memDocs[simId] ? JSON.parse(JSON.stringify(memDocs[simId])) : {};
  }
  try{
    const snap = await db.collection('simulacoes').doc(simId).collection('documentos').get();
    const out = {};
    snap.forEach(d=> out[d.id] = d.data());
    return out;
  }catch(e){
    console.error('Erro loadDocumentos:', e);
    return {};
  }
}

async function deleteSim(id){
  if(!firebaseOk){
    delete memStore[id];
    delete memDocs[id];
    return true;
  }
  const docsMap = ['rgFrente','rgVerso','cpfFrente','comprovanteResidencia','comprovanteRenda'];
  for(const k of docsMap){
    try{ await db.collection('simulacoes').doc(id).collection('documentos').doc(k).delete(); }catch(e){}
  }
  await db.collection('simulacoes').doc(id).delete();
  return true;
}

async function deleteDocumento(simId, key){
  if(!firebaseOk){
    if(memDocs[simId]) delete memDocs[simId][key];
    return true;
  }
  await db.collection('simulacoes').doc(simId).collection('documentos').doc(key).delete();
  return true;
}

// ---------- Router ----------
function getRoute(){
  const h = location.hash.replace('#','');
  if(h === 'consulta') return {view:'consulta'};
  if(h.startsWith('preanalise/')) return {view:'preanalise', id:h.split('/')[1]};
  if(h.startsWith('cliente/')) return {view:'cliente', id:h.split('/')[1]};
  if(h.startsWith('simulacao/')) return {view:'simulacao', id:h.split('/')[1]};
  if(h.startsWith('contratar/')) return {view:'contratar', id:h.split('/')[1]};
  if(h.startsWith('detalhe/')) return {view:'detalhe', id:decodeURIComponent(h.split('/')[1]||'')};
  if(h === 'novo') return {view:'novo'};
  if(h === 'decimo-terceiro') return {view:'decimo-terceiro'};
  return {view:'painel'};
}
window.addEventListener('hashchange', render);

// ---------- Views ----------
async function render(){
  try{
    await renderInner();
  }catch(e){
    document.getElementById('app').innerHTML = `
      <div class="wrap">
        <div class="card">
          <h2>Ops, algo travou</h2>
          <p class="hint">Não foi possível carregar os dados agora. Se apareceu um aviso de "Acessar dados compartilhados", toque em Permitir e tente de novo.</p>
          <button class="btn btn-primary" onclick="render()">Tentar novamente</button>
        </div>
      </div>`;
  }
}

async function renderInner(){
  const route = getRoute();
  const app = document.getElementById('app');
  if(!cdcAuthReady){ app.innerHTML = '<div class="wrap"><div class="card">Verificando acesso…</div></div>'; return; }
  if(route.view==='consulta'){const module=await import('./cdc-status.mjs?v=1');module.mountStatus(app,{db});return;}
  if(route.view==='preanalise'){const module=await import('./cdc-preanalise.mjs?v=1');await module.mountCustomer(app,route.id,{db,fb:firebase,logo:LOGO_DATAURL});return;}
  if(route.view==='cliente' && /^[a-f0-9]{64}$/.test(route.id)){app.innerHTML=await viewCliente(route.id);return;}
  if(!isCdcAdmin()) { renderCdcLogin(app); return; }
  if(route.view === 'cliente'){
    app.innerHTML = await viewCliente(route.id);
    return;
  }
  if(route.view === 'simulacao'){
    app.innerHTML = await viewSimulacaoPublica(route.id);
    return;
  }
  if(route.view === 'contratar'){
    app.innerHTML = await viewContratar(route.id);
    wireContratarEvents(route.id);
    await mountContratacaoReview(route.id);
    return;
  }
  const tabs = `
    <button class="btn btn-outline" style="margin-bottom:12px" onclick="cdcLogout()">Sair do painel</button>
    <div class="tabbar">
      <button class="${route.view==='painel'||route.view==='detalhe'?'active':''}" onclick="location.hash=''">Painel</button>
      <button class="${route.view==='novo'?'active':''}" onclick="location.hash='novo'">Nova simulação</button>
      <button class="${route.view==='decimo-terceiro'?'active':''}" onclick="location.hash='decimo-terceiro'">Antecipar 13º</button>
    </div>`;
  const header = `
    <header class="top">
      <img src="${LOGO_DATAURL}" alt="Crediti">
      <div>
        <div class="brand-name">CDC Crediti</div>
        <div class="brand-sub">Simulador &amp; propostas — ${EMPRESA.nome}</div>
      </div>
    </header>`;
  let body = '';
  const firebaseWarning = firebaseOk ? '' : `
    <div class="card" style="border-color:#e29b00;background:#fff8e6;">
      <h2 style="color:#8a5a00;">🧪 Modo de teste (dados temporários)</h2>
      <p class="hint" style="color:#8a5a00;">Você já pode testar o fluxo inteiro agora. Os dados ficam guardados só nesta sessão e somem ao fechar. Quando quiser publicar de verdade, configure o <b>firebaseConfig</b> no início do arquivo (veja o COMO-PUBLICAR.md).</p>
    </div>`;
  if(route.view === 'detalhe') body = `
    <button class="btn btn-outline" style="margin-bottom:12px;" onclick="location.hash=''">← Voltar ao painel</button>
    <div id="detalhe"><div class="card"><p class="hint">Abrindo proposta...</p></div></div>`;
  else if(route.view === 'novo') body = viewNovo();
  else if(route.view === 'decimo-terceiro') body = viewDecimoTerceiro();
  else body = await viewPainel();
  app.innerHTML = header + tabs + firebaseWarning + body + `<div class="footer-note">${EMPRESA.nome} · ${EMPRESA.endereco} · ${EMPRESA.telefone}</div>`;
  wireEvents(route.view);
  if(route.view === 'detalhe'){
    await abrirDetalhe(route.id);
    window.scrollTo({top:0, behavior:'auto'});
  }
}

const INSS_2026 = [
  { limite: 1621.00, aliquota: 7.5 },
  { limite: 2902.84, aliquota: 9 },
  { limite: 4354.27, aliquota: 12 },
  { limite: 8475.55, aliquota: 14 }
];

function calcularInss2026(base){
  const salario = Math.max(0, Number(base) || 0);
  let contribuicao = 0;
  let anterior = 0;
  let aliquotaNominal = 0;
  for(const faixa of INSS_2026){
    const tributavel = Math.max(0, Math.min(salario, faixa.limite) - anterior);
    if(tributavel > 0){
      contribuicao += tributavel * (faixa.aliquota / 100);
      aliquotaNominal = faixa.aliquota;
    }
    anterior = faixa.limite;
    if(salario <= faixa.limite) break;
  }
  contribuicao = Math.round((contribuicao + 0.00000001) * 100) / 100;
  return {
    valor: contribuicao,
    aliquotaNominal,
    aliquotaEfetiva: salario ? (contribuicao / salario) * 100 : 0
  };
}

function arredondarCentavos(valor){
  return Math.round((Number(valor) + 0.00000001) * 100) / 100;
}

function hojeFortalezaIso(instante = Date.now()){
  const partes = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Fortaleza', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date(instante));
  const mapa = Object.fromEntries(partes.map(p=>[p.type,p.value]));
  return `${mapa.year}-${mapa.month}-${mapa.day}`;
}

function isoDataUtc(data){
  return data.toISOString().slice(0,10);
}

function ajustarParaDiaUtilAnterior(data){
  const ajustada = new Date(data.getTime());
  while(ajustada.getUTCDay() === 0 || ajustada.getUTCDay() === 6){
    ajustada.setUTCDate(ajustada.getUTCDate() - 1);
  }
  return ajustada;
}

function dataPadraoParcela13(parcela){
  const hojeIso = hojeFortalezaIso();
  let ano = Number(hojeIso.slice(0,4));
  const criar = (y)=> ajustarParaDiaUtilAnterior(
    parcela === 'segunda' ? new Date(Date.UTC(y,11,20)) : new Date(Date.UTC(y,10,30))
  );
  let data = criar(ano);
  if(isoDataUtc(data) < hojeIso) data = criar(ano + 1);
  return isoDataUtc(data);
}

function mesesAteData13(dataIso){
  if(!dataIso) return 1;
  const hoje = new Date(hojeFortalezaIso() + 'T00:00:00Z');
  const destino = new Date(dataIso + 'T00:00:00Z');
  const dias = Math.max(1, Math.ceil((destino - hoje) / 86400000));
  return Math.max(1, Math.min(12, Math.ceil(dias / 30)));
}

function atualizarPrazoD13(forcarData){
  const parcelaEl = document.getElementById('d13-parcela');
  const dataEl = document.getElementById('d13-data-recebimento');
  const mesesEl = document.getElementById('d13-meses');
  if(!parcelaEl || !dataEl || !mesesEl) return;
  if(forcarData || !dataEl.value) dataEl.value = dataPadraoParcela13(parcelaEl.value);
  mesesEl.value = mesesAteData13(dataEl.value);
}

function onCalcularDecimoTerceiro(){
  const salario = parseMoedaBR(document.getElementById('d13-salario').value);
  const parcelaEscolhida = document.getElementById('d13-parcela').value;
  const meses = Math.max(1, Math.min(12, Math.floor(Number(document.getElementById('d13-meses').value) || 1)));
  const taxaEl = document.getElementById('d13-taxa');
  const taxaInformada = Number(taxaEl.value);
  const taxa = Number.isFinite(taxaInformada) ? Math.max(10, taxaInformada) : 10;
  const aplicarInss = document.getElementById('d13-aplicar-inss').checked;
  const dataRecebimento = document.getElementById('d13-data-recebimento').value;
  const resultado = document.getElementById('d13-resultado');

  taxaEl.value = taxa.toFixed(2).replace('.00','');
  document.getElementById('d13-meses').value = meses;
  if(!salario){
    resultado.innerHTML = '';
    toast('Informe o salário bruto para calcular.');
    return;
  }

  const primeira = arredondarCentavos(salario * 0.5);
  const inss = calcularInss2026(salario);
  const inssAplicado = aplicarInss ? inss.valor : 0;
  const segunda = arredondarCentavos(Math.max(0, salario - primeira - inssAplicado));
  const parcelaFutura = parcelaEscolhida === 'segunda' ? segunda : primeira;
  const percentualTotal = (taxa / 100) * meses;
  const fatorLiquido = 1 - percentualTotal;
  const custoMaximo = arredondarCentavos(parcelaFutura * percentualTotal);
  const valorLiberadoMaximo = arredondarCentavos(parcelaFutura - custoMaximo);
  let valorLiberado = valorLiberadoMaximo;
  let valorQuitacao = parcelaFutura;
  let custo = custoMaximo;
  let cetMensal = valorLiberado > 0
    ? (Math.pow(valorQuitacao / valorLiberado, 1 / meses) - 1) * 100
    : 0;
  const nomeParcela = parcelaEscolhida === 'segunda' ? '2ª parcela' : '1ª parcela';
  const inssStatus = aplicarInss ? brl(inss.valor) : `${brl(0)} (desativado)`;

  if(fatorLiquido <= 0 || valorLiberadoMaximo <= 0){
    resultado.innerHTML = '';
    toast('A taxa e o prazo consomem todo o valor da parcela. Reduza o prazo ou a taxa.');
    return;
  }

  resultado.innerHTML = `
    <div class="result-box">
      <div class="kv"><span>13º bruto estimado</span><b>${brl(salario)}</b></div>
      <div class="result-section">
        <div class="result-section-title">1ª parcela</div>

      </div>
      <div class="result-section">
        <div class="result-section-title">2ª parcela</div>
        <div class="kv"><span>Valor bruto (50%)</span><b>${brl(primeira)}</b></div>
        <div class="kv"><span>Desconto do INSS</span><b>${inssStatus}</b></div>
        <div class="kv"><span>Alíquota da última faixa</span><b>${inss.aliquotaNominal.toFixed(1).replace('.',',')}%</b></div>
        <div class="kv"><span>Percentual efetivo do INSS</span><b>${inss.aliquotaEfetiva.toFixed(2).replace('.',',')}%</b></div>
        <div class="kv"><span>Valor líquido após INSS</span><b>${brl(segunda)}</b></div>
      </div>
      <div class="result-section result-section-selected">
        <div class="result-section-title">Antecipação da ${nomeParcela}</div>
        <div class="kv"><span>Valor disponível da parcela</span><b>${brl(parcelaFutura)}</b></div>
        <div class="kv"><span>Data prevista para receber</span><b>${fmtDate(dataRecebimento)}</b></div>
        <div class="kv"><span>Prazo até receber</span><b>${meses} ${meses===1?'mês':'meses'}</b></div>

    <button class="btn btn-outline" id="btn-d13-pdf">Gerar PDF da simulação</button>
    <button class="btn btn-primary" id="btn-d13-contratar">Contratar e continuar</button>`;

  const valorLiberadoEl = document.getElementById('d13-valor-liberado');
  wireMoedaMask(valorLiberadoEl);
  const recalcularPeloValorLiberado = ()=>{

    if(valorInformado > valorLiberadoMaximo){

      toast('O valor liberado não pode ultrapassar o máximo calculado.');
    }
    valorLiberado = arredondarCentavos(valorInformado);
    valorQuitacao = valorLiberado > 0
      ? arredondarCentavos(Math.min(parcelaFutura, valorLiberado / fatorLiquido))
      : 0;
    custo = arredondarCentavos(Math.max(0, valorQuitacao - valorLiberado));
    cetMensal = valorLiberado > 0
      ? (Math.pow(valorQuitacao / valorLiberado, 1 / meses) - 1) * 100
      : 0;
    document.getElementById('d13-valor-quitacao').textContent = brl(valorQuitacao);
    document.getElementById('d13-calculo-retorno').textContent = `${brl(valorQuitacao)} × ${taxa.toFixed(2).replace('.',',')}% × ${meses}`;
    document.getElementById('d13-retorno-crediti').textContent = brl(custo);
    return valorLiberado > 0;
  };
  valorLiberadoEl.addEventListener('input', recalcularPeloValorLiberado);

  document.getElementById('btn-d13-pdf').onclick = ()=>{
    const cliente = document.getElementById('d13-cliente').value.trim();
    if(!cliente){
      toast('Informe o nome completo do cliente para gerar o PDF.');
      document.getElementById('d13-cliente').focus();
      return;
    }
    if(!recalcularPeloValorLiberado()){
      toast('Informe um valor para liberar ao cliente.');
      valorLiberadoEl.focus();
      return;
    }
    gerarPDFSimulacaoDecimoTerceiro({
      cliente,
      salarioBruto: salario,
      primeiraParcela: primeira,
      segundaParcelaBruta: primeira,
      segundaParcelaLiquida: segunda,
      inssCalculado: inss.valor,
      inssAplicado,
      aplicarInss,
      aliquotaInssNominal: inss.aliquotaNominal,
      aliquotaInssEfetiva: inss.aliquotaEfetiva,
      parcelaEscolhida,
      nomeParcela,
      parcelaFutura,
      valorLiberadoMaximo,
      valorQuitacao,
      dataRecebimento,
      meses,
      taxa,
      cetMensal,
      custo,
      valorLiberado
    });
  };

  document.getElementById('btn-d13-contratar').onclick = async ()=>{
    const cliente = document.getElementById('d13-cliente').value.trim();
    if(!cliente){
      toast('Informe o nome completo do cliente.');
      document.getElementById('d13-cliente').focus();
      return;
    }
    if(!recalcularPeloValorLiberado()){
      toast('Informe um valor para liberar ao cliente.');
      valorLiberadoEl.focus();
      return;
    }
    const btn = document.getElementById('btn-d13-contratar');
    btn.disabled = true;
    btn.textContent = 'Abrindo contratação...';
    const vencimento = dataRecebimento;
    const cetAnual = (Math.pow(1 + cetMensal / 100, 12) - 1) * 100;
    const proposta = {
      id: uid(),
      produto: 'antecipacao_13',
      cliente,
      valor: valorLiberado,
      prazo: 1,
      taxa,
      cet: cetMensal,
      cetAnual,
      parcela: valorQuitacao,
      dataPrimeira: vencimento,
      dataUltima: vencimento,
      salarioBruto: salario,
      parcela13: parcelaEscolhida,
      mesesAntecipacao: meses,
      dataPrevistaRecebimento13: dataRecebimento,
      primeiraParcela13: primeira,
      segundaParcela13: segunda,
      inssCalculado: inss.valor,
      inssAplicado,
      aliquotaInssNominal: inss.aliquotaNominal,
      aliquotaInssEfetiva: inss.aliquotaEfetiva,
      custoAntecipacao: custo,
      retornoCrediti: custo,
      valorDisponivelParcela: parcelaFutura,
      valorLiberadoMaximo,
      valorQuitacao,
      regraCalculoAntecipacao: 'desconto_direto_sobre_parcela',
      criadoEm: Date.now(),
      status: 'contratando'
    };
    try{
      await saveSim(proposta);
      location.hash = 'contratar/' + proposta.id;
    }catch(e){
      console.error('Erro ao criar proposta de antecipação:', e);
      toast('Não foi possível abrir a contratação: ' + (e.message || e));
      btn.disabled = false;
      btn.textContent = 'Contratar e continuar';
    }
  };
}

async function viewPainel(){
  const sims = await listSims();
  window.__simsCache = Object.fromEntries(sims.map(s=>[s.id,s]));
  if(sims.length===0){
    return `<div class="card"><div class="empty">Nenhuma simulação criada ainda.<br>Toque em <b>Nova simulação</b> para começar.</div></div>`;
  }
  const statusLabel = (s)=>{
    if(s.aceite) return `<span class="badge badge-ok">CCB assinada</span>`;
    // A decisão manual prevalece; sem decisão, exiba o resultado da análise.
    const analiseStatus = s.analiseCdc?.decisao?.status || s.analiseCdc?.resultado?.status;
    if(analiseStatus==='Recusada') return `<span class="badge badge-pending">Recusado</span>`;
    if(s.status==='preanalise_recebida')return `<span class="badge badge-wait">Documentos recebidos</span>`;
    if(s.status==='preanalise_aguardando')return `<span class="badge badge-pending">Aguardando documentos</span>`;
    if(s.status==='aguardando_cliente'){
      const completos = s.documentosEnviados && s.documentosEnviados.length>=4;
      return completos
        ? `<span class="badge badge-wait">Aguardando assinatura</span>`
        : `<span class="badge badge-pending">Pendente</span>`;
    }
    if(s.status==='contratando') return `<span class="badge badge-pending">Pendente</span>`;
    return `<span class="badge badge-wait">Simulação</span>`;
  };
  let rows = sims.map(s=>{
    const extra = s.aceite ? `<div class="sub" style="color:var(--ok);font-weight:700;cursor:pointer;text-decoration:underline;" onclick="abrirPaginaDetalhe('${s.id}')">📁 Documentos e CCB prontos para baixar</div>` : '';
    const resumo = isDecimoTerceiro(s)
      ? `<span class="badge badge-wait">13º</span> ${brl(s.valor)} liberado · quitação de ${brl(s.parcela)}`
      : `${brl(s.valor)} · ${s.prazo}x de ${brl(s.parcela)}`;
    return `
    <div class="sim-item">
      <div>
        <div class="nm">${s.cliente || 'Cliente'}</div>
        <div class="sub">${resumo} ${statusLabel(s)}</div>
        ${extra}
      </div>
      <button class="btn btn-outline btn-sm" onclick="abrirPaginaDetalhe('${s.id}')">Ver</button>
    </div>`;
  }).join('');
  return `<div class="card"><h2>Simulações</h2>${rows}</div>`;
}

window.abrirPaginaDetalhe = function(id){

};

function htmlDocumentosCliente(simId, docs){
  const docsMap = [['rgFrente','RG - Frente'],['rgVerso','RG - Verso'],['cpfFrente','CPF - Frente'],['comprovanteResidencia','Comprov. Residência'],['comprovanteRenda','Comprov. Renda']];
  for(const key of Object.keys(docs))if(!docsMap.some(([k])=>k===key))docsMap.push([key,docs[key].nome||'Anexo adicional']);
  const linhas = docsMap.map(([key,label])=>{
    const d = docs[key];
    if(!d) return `<div class="sim-item"><div><div class="nm">${label}</div><div class="sub">Não enviado</div></div></div>`;
    return `<div class="sim-item">
      <div><div class="nm">${label}</div><div class="sub">${d.nome||'arquivo'}</div></div>
      <div style="display:flex;gap:6px;flex:0 0 auto;">
        <button class="btn btn-outline btn-sm" onclick="baixarDocumento('${simId}','${key}')">Baixar</button>
        <button class="btn btn-outline btn-sm" style="border-color:var(--danger);color:var(--danger);" onclick="excluirDocumento('${simId}','${key}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
  return `<h2>Documentos do cliente</h2><p class="hint">Pra trocar um documento errado: apaga ele aqui e depois use "Continuar contratação" pra subir o novo arquivo.</p>${linhas}`;
}

async function carregarDocumentosDetalhe(simId){
  const box = document.getElementById('documentos-cliente');
  if(!box || box.dataset.simId !== simId) return;
  try{
    window.__docsCache = window.__docsCache || {};
    const docs = window.__docsCache[simId] || await loadDocumentos(simId);
    window.__docsCache[simId] = docs;
    const atual = document.getElementById('documentos-cliente');
    if(atual && atual.dataset.simId === simId) atual.innerHTML = htmlDocumentosCliente(simId, docs);
  }catch(e){
    console.error('Erro ao carregar documentos:', e);
    const atual = document.getElementById('documentos-cliente');
    if(atual && atual.dataset.simId === simId) atual.innerHTML = `<h2>Documentos do cliente</h2><p class="hint">Não foi possível carregar os arquivos agora. <button class="btn btn-outline btn-sm" onclick="carregarDocumentosDetalhe('${simId}')">Tentar novamente</button></p>`;
  }
}

  }catch(e){

window.apagarAssinatura = async function(id){
  const ok = confirm('Apagar a assinatura e a foto atuais? O cliente vai precisar abrir o link de novo e tirar a foto de novo.');
  if(!ok) return;

    console.error('Erro ao apagar assinatura:', e);

};

    <p class="hint">Escolha a forma do cálculo, altere as condições e toque em Recalcular simulação. O sistema só permitirá salvar depois de atualizar todos os valores.</p>

  document.getElementById('ei-modo').addEventListener('change', alternarModoEdicao);
  document.getElementById('ei-prazo').addEventListener('change', ()=>{
    document.getElementById('ei-taxa').value = getTaxaSugeridaPorPrazo(Number(document.getElementById('ei-prazo').value));
  });
  for(const campo of ['ei-valor','ei-parcela','ei-prazo','ei-taxa','ei-data1']){
    for(const evento of ['input','change']) document.getElementById(campo).addEventListener(evento, invalidarCalculo);
  }
  document.getElementById('btn-recalcular-inline').onclick = ()=>{
    try{
      const modoCalculo = document.getElementById('ei-modo').value;
      const entrada = parseValorCreditoBR(document.getElementById(modoCalculo==='parcela'?'ei-parcela':'ei-valor').value);
      const prazo = Number(document.getElementById('ei-prazo').value);
      const taxa = Number(document.getElementById('ei-taxa').value);
      const data1 = document.getElementById('ei-data1').value;
      if(!entrada || !prazo || !data1) throw new Error('Preencha valor, prazo e data da 1ª parcela.');
      const calculo = calcularCdcPorDatas(entrada, taxa, prazo, dataBase, data1, modoCalculo);
      const valor = calculo.valorLiberado;
      const retorno = arredondarCentavos(calculo.totalPagar-valor);
      calculoEditado = {valor, prazo, taxa, data1, calculo};
      document.getElementById('ei-resultado').innerHTML = `
        <div class="result-box" style="margin-top:14px;">
          <div class="kv"><span>Valor liberado ao cliente</span><b>${brl(valor)}</b></div>
          <div class="kv"><span>Parcela mensal</span><b>${brl(calculo.parcela)}</b></div>
          <div class="kv"><span>Última parcela</span><b>${fmtDate(calculo.dataUltima)}</b></div>
          <div class="kv"><span>Total a pagar</span><b>${brl(calculo.totalPagar)}</b></div>
          <div class="kv"><span>Retorno bruto da Crediti (interno)</span><b>${brl(retorno)}</b></div>
        </div>`;
      document.getElementById('btn-salvar-inline').disabled = false;
    }catch(e){
      invalidarCalculo();
      toast(e.message || String(e));
    }
  };
  document.getElementById('btn-salvar-inline').onclick = async ()=>{
    const btn = document.getElementById('btn-salvar-inline');
    if(!calculoEditado){ toast('Recalcule a simulação antes de salvar.'); return; }
    btn.disabled = true; btn.textContent = 'Salvando...';
    try{
      const {valor, prazo, taxa, data1, calculo} = calculoEditado;
      const jaEstavaAssinado = !!s.aceite;
      s.valor = valor; s.prazo = prazo; s.taxa = taxa; s.cet = taxa;
      s.dataPrimeira = data1;
      Object.assign(s, calculo);
      s.cetAnual = (Math.pow(1+taxa/100,12)-1)*100;
      if(jaEstavaAssinado){
        s.aceite = null;
        s.status = 'aguardando_cliente';
      }
      await saveSim(s);
      toast(jaEstavaAssinado ? 'Alterado! Cliente precisa assinar de novo.' : 'Simulação atualizada!');
      abrirDetalhe(s.id);
    }catch(e){
      console.error('Erro ao salvar alterações:', e);
      toast('Erro ao salvar: ' + (e.message||e));
      btn.disabled = false; btn.textContent = '💾 Salvar alterações';
    }
  };
  invalidarCalculo();
};

function dataUrlParaBlob(dataUrl){
  if(typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) return null;
  const pos = dataUrl.indexOf(',');
  if(pos < 0) return null;
  const cabecalho = dataUrl.slice(0, pos);
  const mime = (cabecalho.match(/^data:([^;,]+)/)||[])[1] || 'application/octet-stream';
  const conteudo = dataUrl.slice(pos + 1);
  const binario = cabecalho.includes(';base64') ? atob(conteudo) : decodeURIComponent(conteudo);
  const partes = [];
  for(let i=0; i<binario.length; i+=8192){
    const trecho = binario.slice(i, i+8192);
    const bytes = new Uint8Array(trecho.length);
    for(let j=0; j<trecho.length; j++) bytes[j] = trecho.charCodeAt(j);
    partes.push(bytes);
  }
  return new Blob(partes, {type:mime});
}

window.baixarDocumento = function(simId, key){
  const cache = (window.__docsCache && window.__docsCache[simId]) || {};
  const d = cache[key];
  if(!d){ toast('Documento não encontrado.'); return; }
  try{
    const blob = dataUrlParaBlob(d.dataUrl);
    const href = blob ? URL.createObjectURL(blob) : d.dataUrl;
    if(!href) throw new Error('Arquivo sem conteúdo');
    const a = document.createElement('a');
    a.href = href;
    a.download = d.nome || (key + (d.tipo && d.tipo.includes('pdf') ? '.pdf' : '.jpg'));
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    if(blob) setTimeout(()=>URL.revokeObjectURL(href), 60000);
  }catch(e1){
    console.error('Erro ao abrir documento:', e1);
    try{
      const w = window.open(d.dataUrl, '_blank');
      if(!w) throw new Error('Abertura bloqueada pelo navegador');
    }catch(e2){ toast('Não foi possível abrir este documento. Tente novamente.'); }
  }
};

window.excluirDocumento = async function(simId, key){
  const ok = confirm('Apagar este documento? Depois disso você pode subir um novo em "Continuar contratação".');
  if(!ok) return;
  try{
    await deleteDocumento(simId, key);
    if(window.__docsCache && window.__docsCache[simId]) delete window.__docsCache[simId][key];
    toast('Documento apagado.');
    abrirDetalhe(simId);
  }catch(e){
    console.error('Erro ao excluir documento:', e);
    toast('Erro ao apagar: ' + (e.message||e));
  }
};

// Tenta baixar o PDF; se o navegador/preview bloquear o download,
// tenta abrir em nova aba; se tudo falhar, mostra o erro real.
function salvarOuAbrirPdf(doc, filename){
  try{
    doc.save(filename);
    return true;
  }catch(e1){
    console.warn('Download direto falhou, tentando abrir em nova aba:', e1);
    try{
      const blobUrl = doc.output('bloburl');
      const w = window.open(blobUrl, '_blank');
      if(!w){ throw new Error('Pop-up bloqueado pelo navegador'); }
      return true;
    }catch(e2){
      console.error('Erro ao gerar PDF:', e2);
      const msg = (e2 && (e2.message || e2.toString())) || 'erro desconhecido';
      toast('Não foi possível abrir o PDF: ' + msg);
      return false;
    }
  }
}

function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function wireFaixaSugestao(){
  const valorEl = document.getElementById('f-valor');
  const taxaEl = document.getElementById('f-taxa');
  const prazoEl = document.getElementById('f-prazo');
  const hintEl = document.getElementById('faixa-hint');
  let taxaTocada = false, prazoTocado = false;

  const atualizarSugestaoDoPrazo = (forcarTaxa = false)=>{
    const prazo = Number(prazoEl.value) || CONFIG.prazoMin;
    const taxaSugerida = getTaxaSugeridaPorPrazo(prazo);
    hintEl.textContent = `💡 Taxa sugerida para ${prazo}x: ${taxaSugerida}% a.m.`;
    if(forcarTaxa || !taxaTocada) taxaEl.value = taxaSugerida;
  };

  taxaEl.addEventListener('input', ()=>{ taxaTocada = true; });
  prazoEl.addEventListener('change', ()=>{
    prazoTocado = true;
    taxaTocada = false;
    atualizarSugestaoDoPrazo(true);
  });
  valorEl.addEventListener('input', ()=>{
    const valor = parseValorCreditoBR(valorEl.value);
    if(!valor){ hintEl.textContent=''; return; }
    const f = getFaixa(valor);
    if(!prazoTocado) prazoEl.value = f.prazoMax;
    atualizarSugestaoDoPrazo(false);
  });
  atualizarSugestaoDoPrazo(false);
}

function wireMilharMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    const digits = input.value.replace(/\D/g,'');
    input.value = digits ? Number(digits).toLocaleString('pt-BR') : '';
  });
}
function parseMilhar(str){
  return Number(String(str||'').replace(/\D/g,''));
}
// Valor do crédito: aceita 11386,50, 11.386,50, 11386.50 ou valor inteiro.
function parseValorCreditoBR(str){
  let valor = String(str||'').trim().replace(/\s/g,'').replace(/R\$/gi,'');
  if(!valor) return 0;
  if(valor.includes(',')){
    valor = valor.replace(/\./g,'').replace(',','.');
  }else{
    const pontos = (valor.match(/\./g)||[]).length;
    if(pontos > 1 || (pontos === 1 && /\.\d{3}$/.test(valor))) valor = valor.replace(/\./g,'');
  }
  valor = valor.replace(/[^\d.-]/g,'');
  const numero = Number(valor);
  return Number.isFinite(numero) ? Math.round(numero*100)/100 : 0;
}
function wireValorCreditoMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let valor = input.value.replace(/[^\d.,]/g,'');
    const primeiraVirgula = valor.indexOf(',');
    if(primeiraVirgula >= 0){
      valor = valor.slice(0,primeiraVirgula+1) + valor.slice(primeiraVirgula+1).replace(/,/g,'').slice(0,2);
    }
    input.value = valor;
  });
  input.addEventListener('blur', ()=>{
    const valor = parseValorCreditoBR(input.value);
    input.value = valor ? valor.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '';
  });
}
function parseMoedaBR(str){
  const digits = String(str||'').replace(/\D/g,'');
  return digits ? Number(digits) / 100 : 0;
}

async function onCalcular(){
  window.__simTemp = null;
  document.getElementById('resultado').innerHTML = '';
  const cliente = document.getElementById('f-cliente').value.trim();
  const modoCalculo = document.getElementById('f-modo').value;
  const entrada = modoCalculo === 'parcela'
    ? parseValorCreditoBR(document.getElementById('f-parcela').value)
    : parseValorCreditoBR(document.getElementById('f-valor').value);
  const prazo = Number(document.getElementById('f-prazo').value);
  const taxaTexto = document.getElementById('f-taxa').value;
  const taxa = taxaTexto === '' ? getTaxaSugeridaPorPrazo(prazo) : Number(taxaTexto);
  const data1 = document.getElementById('f-data1').value;
  if(!cliente || !entrada || !prazo || !data1){
    toast('Preencha nome, valor do crédito ou da parcela, prazo e data da 1ª parcela.');
    return;
  }
  if(prazo < CONFIG.prazoMin || prazo > CONFIG.prazoMax){
    toast(`O prazo deve ser entre ${CONFIG.prazoMin} e ${CONFIG.prazoMax} meses.`);
    return;
  }
  const cet = taxa; // CET aproximado (sem tarifas adicionais)
  let calculo;
  try{ calculo = calcularCdcPorDatas(entrada, taxa, prazo, hojeFortalezaIso(), data1, modoCalculo); }
  catch(e){ toast(e.message); return; }
  const {parcela, dataUltima} = calculo;
  const valor = calculo.valorLiberado;
  const cetAnual = (Math.pow(1+cet/100,12)-1)*100;

let __stream = null;
async function iniciarFluxoAssinatura(id){
  const box = document.getElementById('fluxo-assinatura');
  box.innerHTML = `
    <div class="card">
      <div class="step-title">1. Tire uma foto (assinatura digital)</div>
      <p class="hint">Centralize seu rosto e ombros dentro da guia. Olhe direto para a câmera — sem virar a cabeça para os lados, para cima ou para baixo.</p>
      <div class="cam-wrap">
        <video id="video" autoplay playsinline></video>
        <div class="face-guide"></div>
      </div>
      <canvas id="canvas"></canvas>
      <button class="btn btn-gold" id="btn-snap">Capturar foto</button>
      <p class="hint" style="margin-top:8px;">Se a câmera não abrir, verifique a permissão de câmera do navegador.</p>
    </div>`;
  try{
    __stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:480},
        height:{ideal:640},
        aspectRatio:{ideal:0.75}
      },
      audio:false
    });
    document.getElementById('video').srcObject = __stream;
  }catch(err){
    box.innerHTML = `<div class="card"><p class="hint">Não foi possível acessar a câmera (${err.message}). Verifique as permissões do navegador e tente novamente.</p>
    <button class="btn btn-outline" onclick="iniciarFluxoAssinatura('${id}')">Tentar novamente</button></div>`;
    return;
  }
  document.getElementById('btn-snap').onclick = ()=>capturarFoto(id);
}

async function capturarFoto(id){
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  const foto = canvas.toDataURL('image/jpeg', 0.85);
  if(__stream){ __stream.getTracks().forEach(t=>t.stop()); __stream=null; }
  const fotoComprimida = await compressImage(foto, 480);
  window.__fotoTemp = fotoComprimida;
  const box = document.getElementById('fluxo-assinatura');
  box.innerHTML = `
    <div class="card">
      <div class="step-title">Foto capturada ✓</div>
      <img class="cam-preview" src="${fotoComprimida}">
      <div class="step-title" style="margin-top:16px;">2. Confirmando sua localização...</div>
      <div class="geo-box" id="geo-status">Obtendo localização (permita o acesso quando solicitado)...</div>
    </div>`;
  capturarGeo(id);
}

async function capturarGeo(id){
  const status = document.getElementById('geo-status');
  if(!navigator.geolocation){
    status.textContent = 'Geolocalização não suportada neste navegador.';
    window.__geoTemp = null;
    finalizarAssinatura(id);
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const geo = {lat: pos.coords.latitude, lng: pos.coords.longitude, precisao: pos.coords.accuracy};
    let endereco = '';
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${geo.lat}&lon=${geo.lng}`);
      const j = await r.json();
      endereco = j.display_name || '';
    }catch(e){ /* geocoding pode falhar por CORS/rede - segue sem endereço */ }
    status.textContent = `Localização obtida: ${geo.lat.toFixed(5)}, ${geo.lng.toFixed(5)}${endereco ? ' — '+endereco : ''}`;
    window.__geoTemp = {geo, endereco};
    finalizarAssinatura(id);
  }, (err)=>{
    status.textContent = `Não foi possível obter a localização (${err.message}). Continuando sem geolocalização.`;
    window.__geoTemp = null;
    finalizarAssinatura(id);
  }, {enableHighAccuracy:true, timeout:12000});
}

async function finalizarAssinatura(id){
  if(window.__signatureSending)return;
  window.__signatureSending=true;
  try{
  const s = await loadSim(id);
  if(!s){document.getElementById('app').innerHTML='<div class="wrap"><div class="card"><h2>Link indisponível</h2><p>O link já foi utilizado, expirou ou não pôde ser carregado. Confira sua conexão ou fale com a Crediti.</p></div></div>';return;}
  const geoData = window.__geoTemp;
  if(!s.numeroCCB && !/^[a-f0-9]{64}$/.test(id)) s.numeroCCB = await gerarNumeroCCB();
  s.aceite = {
    timestamp: Date.now(),
    foto: window.__fotoTemp,
    geo: geoData ? geoData.geo : null,
    endereco: geoData ? geoData.endereco : null
  };
  await saveSim(s);
  const box = document.getElementById('app');
  box.innerHTML = `
    <div class="wrap"><div class="card final-ok">
      ✅ Proposta aceita e assinada com sucesso!<br>
      ${s.numeroCCB?'Número da proposta: <b>'+s.numeroCCB+'</b><br>':'A Crediti disponibilizará a CCB com sua numeração.<br>'}
      Este link foi encerrado e não pode ser utilizado novamente.
    </div></div>`;
  window.__fotoTemp=null;window.__geoTemp=null;
  }catch(error){
    const box=document.getElementById('fluxo-assinatura');
    if(box){box.innerHTML='<div class="card"><p>Não foi possível confirmar o envio. Confira sua conexão e tente novamente. Se o envio já tiver sido recebido, o link ficará encerrado.</p><button class="btn btn-primary" id="retry-signature">Tentar enviar novamente</button></div>';document.getElementById('retry-signature').onclick=()=>finalizarAssinatura(id);}
  }finally{window.__signatureSending=false;}
}

function dataUrlParaBytes(dataUrl){
  const partes = String(dataUrl||'').split(',');
  if(partes.length < 2) throw new Error('Arquivo anexado inválido.');
  const binario = atob(partes[1]);
  const bytes = new Uint8Array(binario.length);
  for(let i=0;i<binario.length;i++) bytes[i] = binario.charCodeAt(i);
  return bytes;
}

async function salvarCCBComDocumentos(doc, documentos, filename){
  const anexos = [
    ['rgFrente','RG - Frente'],
    ['rgVerso','RG - Verso'],
    ['cpfFrente','CPF - Frente'],
    ['comprovanteResidencia','Comprov. Residencia'],
    ['comprovanteRenda','Comprov. Renda']
  ].filter(([key])=> documentos && documentos[key] && documentos[key].dataUrl);
  for(const key of Object.keys(documentos||{}))if(documentos[key]?.dataUrl&&!anexos.some(([k])=>k===key))anexos.push([key,documentos[key].nome||'Anexo adicional']);

  if(!anexos.length){
    salvarOuAbrirPdf(doc, filename);
    return;
  }
  if(!window.PDFLib){
    throw new Error('Biblioteca para juntar os documentos não carregou. Verifique a internet e tente novamente.');
  }

  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const pacote = await PDFDocument.create();
  const ccb = await PDFDocument.load(doc.output('arraybuffer'));
  const paginasCCB = await pacote.copyPages(ccb, ccb.getPageIndices());
  paginasCCB.forEach(p=>pacote.addPage(p));
  const fonte = await pacote.embedFont(StandardFonts.HelveticaBold);
  const falhas = [];

  for(const [key,label] of anexos){
    const anexo = documentos[key];
    try{
      const bytes = dataUrlParaBytes(anexo.dataUrl);
      const tipo = String(anexo.tipo||'').toLowerCase();
      const nome = String(anexo.nome||'').toLowerCase();
      if(tipo.includes('pdf') || nome.endsWith('.pdf')){
        const pdfAnexo = await PDFDocument.load(bytes, {ignoreEncryption:true});
        const paginas = await pacote.copyPages(pdfAnexo, pdfAnexo.getPageIndices());
        paginas.forEach(p=>pacote.addPage(p));
      }else{
        const imagem = String(anexo.dataUrl).startsWith('data:image/png')
          ? await pacote.embedPng(bytes)
          : await pacote.embedJpg(bytes);
        const pagina = pacote.addPage([595.28,841.89]);
        pagina.drawText(label, {x:40,y:805,size:13,font:fonte,color:rgb(0.08,0.08,0.08)});
        pagina.drawLine({start:{x:40,y:792},end:{x:555,y:792},thickness:1.5,color:rgb(0.89,0.61,0)});
        const escala = Math.min(515/imagem.width, 730/imagem.height);
        const largura = imagem.width*escala;
        const altura = imagem.height*escala;
        pagina.drawImage(imagem, {x:(595.28-largura)/2,y:35+(730-altura)/2,width:largura,height:altura});
      }
    }catch(e){
      console.error('Erro ao incorporar documento '+key+':', e);
      falhas.push(label);
    }
  }

  const bytesFinais = await pacote.save();
  const blob = new Blob([bytesFinais], {type:'application/pdf'});
  const blobUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = blobUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(blobUrl), 60000);
  if(falhas.length){
    toast('O PDF foi gerado, mas não foi possível incluir: '+falhas.join(', ')+'.');
  }
}

  // Os documentos reais serão acrescentados depois da CCB, página por página.
  const documentosCliente = await loadDocumentos(s.id);

  if(y > 620){ doc.addPage(); y = 40; }
  doc.setDrawColor(20,20,20); doc.setLineWidth(1);
  doc.line(40, y, pageW-40, y);
  y += 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('ASSINATURA DIGITAL DO CLIENTE', 40, y);
  y += 14;

  if(s.aceite){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.text(`Aceite registrado em: ${fmtTimestamp(s.aceite.timestamp)}`, 40, y); y+=14;
    if(s.aceite.geo){
      doc.text(`Coordenadas: ${fmtCoord(s.aceite.geo.lat,6)}, ${fmtCoord(s.aceite.geo.lng,6)} (precisão ~${Math.round(Number(s.aceite.geo.precisao)||0)}m)`, 40, y); y+=14;
    }
    if(s.aceite.endereco){
      const endLines = doc.splitTextToSize('Endereço aproximado: '+s.aceite.endereco, pageW-80);
      doc.text(endLines, 40, y); y += endLines.length*12+6;
    }
    if(s.aceite.foto){
      try{
        if(y > 620){ doc.addPage(); y = 40; }
        doc.addImage(s.aceite.foto, 'JPEG', 40, y, 140, 140);
        y += 152;
      }catch(e){}
    }
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.text('Proposta ainda não assinada pelo cliente.', 40, y); y+=14;
  }

  await salvarCCBComDocumentos(doc, documentosCliente, `CCB_e_Documentos_${isDecimoTerceiro(s)?'Antecipacao_13':'CDC'}_Crediti_${(s.cliente||'cliente').replace(/\s+/g,'_')}.pdf`);
  }catch(e){
    console.error('Erro ao montar CCB em PDF:', e);
    toast('Erro ao gerar PDF: ' + (e.message||e));
  }
};

});

    <div class="cdc-login-panel"><span class="cdc-login-kicker">CREDITI SOLUÇÕES FINANCEIRAS</span><h1>Bem-vindo ao<br>CDC Crediti</h1><p class="cdc-login-intro">Seu painel de crédito, em um só lugar.<br>Acesso exclusivo do administrador.</p>
    <form id="cdc-login-form">
    <label for="cdc-email">E-mail</label><input id="cdc-email" type="email" autocomplete="username" placeholder="Seu e-mail de acesso" required>
    <label for="cdc-password">Senha de 6 dígitos</label>
    <div class="cdc-login-password"><input id="cdc-password" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" placeholder="Digite sua senha" required>
    <button type="button" id="cdc-eye" aria-label="Mostrar senha" aria-controls="cdc-password" aria-pressed="false">Mostrar</button></div>
    <button type="submit" id="cdc-enter">Entrar no painel</button>
    <button type="button" id="cdc-reset">Esqueci minha senha</button>
    <button type="button" class="btn btn-outline" onclick="location.hash='consulta'">Consultar status da proposta</button>
    <p id="cdc-login-message" role="status" aria-live="polite"></p></form><p class="cdc-login-footer">Crediti · Itapajé, Ceará<br>Área restrita ao administrador</p></div></section>`;
  const email = document.getElementById('cdc-email');
  const pass = document.getElementById('cdc-password');
  const message = document.getElementById('cdc-login-message');
  document.getElementById('cdc-eye').onclick = function(){
    const show = pass.type === 'password'; pass.type = show ? 'text' : 'password';
    this.textContent = show ? 'Ocultar' : 'Mostrar';
    this.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    this.setAttribute('aria-pressed', String(show));
  };
  document.getElementById('cdc-login-form').onsubmit = async function(event){
    event.preventDefault();
    if(email.value.trim().toLowerCase() !== CDC_ADMIN_EMAIL){message.textContent='Acesso permitido somente ao administrador.'; return;}
    const button = document.getElementById('cdc-enter'); button.disabled = true;
    message.textContent = 'Entrando…';
    try{
      await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);
      await firebase.auth().signInWithEmailAndPassword(CDC_ADMIN_EMAIL, pass.value);
      if(!isCdcAdmin()){ await firebase.auth().signOut(); throw new Error('access'); }
    }catch(error){
      message.textContent = error.code === 'auth/too-many-requests'
        ? 'Muitas tentativas. Aguarde antes de tentar novamente.'
        : error.code === 'auth/network-request-failed' ? 'Sem conexão. Tente novamente.'
        : 'Não foi possível entrar. Confira o e-mail e a senha.';
      button.disabled = false;
    }
  };
  document.getElementById('cdc-reset').onclick = async function(){
    this.disabled = true;
    try{
      await firebase.auth().sendPasswordResetEmail(CDC_ADMIN_EMAIL);
      message.textContent = 'Link de redefinição enviado ao e-mail do administrador. Confira também o spam. Use uma senha numérica de 6 dígitos.';
    }catch(error){ message.textContent = 'Não foi possível enviar o link agora. Aguarde e tente novamente.'; }
    finally{ this.disabled = false; }
  };
}
async function cdcLogout(){
  window.__simsCache = null;
  await firebase.auth().signOut();
  location.hash = '';
}
if(firebaseOk){
  firebase.auth().onAuthStateChanged(async user => {
    if(user && (user.uid !== CDC_ADMIN_UID || user.email !== CDC_ADMIN_EMAIL)){
      await firebase.auth().signOut(); return;
    }
    cdcAuthReady = true;
    window.__simsCache = null;
    await render();
  });
}else{
  document.getElementById('app').innerHTML = '<div class="wrap"><div class="card">Não foi possível iniciar o acesso seguro. Atualize a página.</div></div>';
}
</script>
