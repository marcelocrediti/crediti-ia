      (() => {
        const secondaryScripts = [
          '/creator-ads-upload-meus-videos.js?v=20260904-2',
          '/creator-ads-video-status.js?v=20260904-2',
          '/creator-ads-campaign-organizer.js?v=20260904-1'
        ];
        let started = false;
        function loadScriptSequentially(index) {
          if (index >= secondaryScripts.length) return;
          const script = document.createElement('script');
          script.src = secondaryScripts[index];
          script.async = false;
          script.onload = () => loadScriptSequentially(index + 1);
          script.onerror = () => loadScriptSequentially(index + 1);
          document.body.appendChild(script);
        }
        function loadSecondaryScripts() {
          if (started) return;
          started = true;
          loadScriptSequentially(0);
        }
        if (document.readyState === 'complete') setTimeout(loadSecondaryScripts, 300);
        else window.addEventListener('load', () => setTimeout(loadSecondaryScripts, 300), { once:true });
      })();
    </script>
