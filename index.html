<style>
  :root{
    --gold:#f7b500;
    --gold-deep:#e29b00;
    --ink:#141414;
    --ink-soft:#3a3a3a;
    --paper:#fffaf0;
    --card:#ffffff;
    --line:#ecdfc0;
    --ok:#1c7c3f;
    --ok-bg:#e8f5ec;
    --warn:#8a5a00;
    --warn-bg:#fff3d6;
    --danger:#b3261e;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;}
  body{
    margin:0;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#fff8e6 0%,#fdf3d9 100%);
    color:var(--ink);
    min-height:100vh;touch-action:pan-y;position:relative;
  }
  .wrap{width:100%;max-width:720px;margin:0 auto;padding:18px 16px 60px;overflow-x:clip;}
  header.top{
    display:flex;align-items:center;gap:12px;
    padding:14px 4px 20px;
  }
  header.top img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  header.top .brand-name{font-weight:800;font-size:20px;letter-spacing:.2px;}
  header.top .brand-sub{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .tabbar{display:flex;gap:6px;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;}
  .tabbar button{
    flex:1;border:none;background:transparent;padding:10px 6px;border-radius:10px;
    font-weight:700;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
  }
  .tabbar button.active{background:var(--ink);color:var(--gold);}
  select{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;background:#fffdf7;color:var(--ink);
  }
  select:focus{outline:none;border-color:var(--gold-deep);}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px;margin-bottom:16px;box-shadow:0 3px 14px rgba(60,40,0,.06);
  }
  .card h2{margin:0 0 4px;font-size:17px;}
  .card .hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px;}
  input[type=text],input[type=number],input[type=date]{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    min-width:0;max-width:100%;font-size:15px;background:#fffdf7;color:var(--ink);
  }
  input[type=file]{display:block;width:100%;min-width:0;max-width:100%;overflow:hidden;}
  input:focus{outline:none;border-color:var(--gold-deep);}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
  .row2>*{min-width:0;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:12px;padding:13px 18px;font-weight:800;font-size:14.5px;
    cursor:pointer;width:100%;margin-top:16px;
  }
  .btn-primary{background:var(--ink);color:var(--gold);}
  .btn-primary:active{transform:scale(.99);}
  .btn-gold{background:var(--gold);color:var(--ink);}
  .btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-sm{width:auto;padding:9px 14px;font-size:13px;margin-top:0;}
  .result-box{
    background:#fffaeb;border:1.5px dashed var(--gold-deep);border-radius:14px;
    padding:16px;margin-top:16px;
  }
  .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dotted #e6d6a8;}
  .kv:last-child{border-bottom:none;}
  .kv b{font-weight:800;}
  .kv span,.kv b{min-width:0;overflow-wrap:anywhere;}
  .kv b{text-align:right;}
  .muted{color:var(--ink-soft);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;}
  .badge-wait{background:var(--warn-bg);color:var(--warn);}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-pending{background:#fde3e0;color:var(--danger);}
  .sim-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .sim-item>div{min-width:0;}
  .sim-item .sub{overflow-wrap:anywhere;}
  .sim-item:last-child{border-bottom:none;}
  .sim-item .nm{font-weight:800;font-size:14.5px;}
  .sim-item .sub{font-size:12px;color:var(--ink-soft);}
  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13.5px;}
  .disclaimer{font-size:11.5px;color:var(--ink-soft);line-height:1.5;background:#f7f3e8;border-radius:10px;padding:10px 12px;margin-top:14px;}
  .link-box{
    display:flex;gap:8px;align-items:center;background:#f2f2f2;border-radius:10px;padding:8px 10px;margin-top:10px;
  }
  .link-box input{border:none;background:transparent;font-size:12.5px;flex:1;min-width:0;width:100%;}
  a.wa-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:#25D366;color:#fff;text-decoration:none;font-weight:800;
    padding:13px 18px;border-radius:12px;margin-top:10px;font-size:14.5px;
  }
  /* client view */
  .client-hero{
    background:linear-gradient(160deg,var(--gold) 0%,var(--gold-deep) 100%);
    border-radius:20px;padding:24px 20px;text-align:center;color:var(--ink);margin-bottom:16px;
  }
  .client-hero img{width:74px;height:74px;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.3);margin-bottom:10px;}
  .client-hero .valor{font-size:32px;font-weight:900;margin:6px 0 0;}
  .client-hero .label{font-size:12px;font-weight:700;opacity:.8;}
  .accept-box{border:2px solid var(--ink);border-radius:14px;padding:14px;margin-top:16px;font-size:13px;line-height:1.5;}
  video{width:100%;height:100%;border-radius:14px;background:#000;object-fit:cover;display:block;}
  #video{transform:scaleX(-1);}
  .cam-wrap{position:relative;margin-top:6px;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:420px;}
  .face-guide{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64%; height:82%;
    border:3px solid rgba(255,255,255,.9);
    border-radius:50% / 42%;
    box-shadow:0 0 0 1000px rgba(0,0,0,.38);
    pointer-events:none;
  }
  canvas{display:none;}
  .cam-preview{width:100%;border-radius:14px;}
  .step-title{font-weight:800;font-size:14.5px;margin:4px 0 10px;}
  .geo-box{background:#f2f2f2;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
  .final-ok{
    background:var(--ok-bg);border:1.5px solid var(--ok);color:var(--ok);
    border-radius:14px;padding:16px;text-align:center;font-weight:700;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--gold);padding:10px 18px;border-radius:30px;
    font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:99;
  }
  .footer-note{text-align:center;font-size:11px;color:#a08b4a;margin-top:24px;}
  .check-row{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#fff8e6;border:1px solid var(--line);border-radius:12px;margin-top:12px;}
  .check-row input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--ink);flex:0 0 auto;}
  .check-row label{margin:0;cursor:pointer;line-height:1.4;}
  .result-highlight{font-size:23px;font-weight:900;color:var(--ok);}
  .result-section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:12px;}
  .result-section-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.35px;color:var(--warn);margin-bottom:4px;}
  .result-section .kv b{white-space:nowrap;padding-left:10px;}
  .result-section-selected{border:1.5px solid var(--gold-deep);background:#fffdf7;}
  @media(max-width:560px){
    .tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden;}
    .tabbar button{min-width:0;white-space:normal;font-size:11.5px;padding:9px 3px;}
    .row2{grid-template-columns:1fr;gap:0;}
  }
</style>
</head>

function brl(v){
  return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function isDecimoTerceiro(s){
  return !!(s && s.produto === 'antecipacao_13');
}
function nomeProduto(s){
  return isDecimoTerceiro(s) ? 'Antecipação do 13º' : 'CDC';
}
function fmtDate(iso){
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtTimestamp(valor){
  try{
    let data;
    if(valor && typeof valor.toDate === 'function') data = valor.toDate();
    else if(valor && Number.isFinite(Number(valor.seconds))) data = new Date(Number(valor.seconds)*1000);
    else data = new Date(valor);
    return Number.isNaN(data.getTime()) ? 'não informado' : data.toLocaleString('pt-BR');
  }catch(e){ return 'não informado'; }
}
function fmtCoord(valor, casas){
  const numero = Number(valor);
  return Number.isFinite(numero) ? numero.toFixed(casas||5) : 'não informada';
}
function fmtPercentual(valor){
  const numero = Number(valor);
  return Number.isFinite(numero) ? numero.toFixed(2) : '0,00';
}
function addMonths(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1+n, d));
  const yy = dt.getUTCFullYear();
  const mm = String(dt.getUTCMonth()+1).padStart(2,'0');
  const dd = String(dt.getUTCDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
function uid(){
  return 'sim' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

// Número da CCB = sequência do dia + data (ex: 01.04.08.26, 02.04.08.26...)
// O primeiro cliente a formalizar naquele dia recebe 01, o segundo 02, e assim por diante.
// Usa transação do banco pra travar contra duplicidade mesmo se dois clientes assinarem ao mesmo tempo.
const memContadoresCCB = {};
async function gerarNumeroCCB(){
  const hoje = new Date();
  const dd = String(hoje.getDate()).padStart(2,'0');
  const mm = String(hoje.getMonth()+1).padStart(2,'0');
  const yy = String(hoje.getFullYear()).slice(-2);
  const sufixo = `${dd}.${mm}.${yy}`;

  if(!firebaseOk){
    memContadoresCCB[sufixo] = (memContadoresCCB[sufixo] || 0) + 1;
    return `${String(memContadoresCCB[sufixo]).padStart(2,'0')}.${sufixo}`;
  }

  try{
    const ref = db.collection('contadoresCCB').doc(sufixo);
    const novoValor = await db.runTransaction(async (tx)=>{
      const docSnap = await tx.get(ref);
      const atual = docSnap.exists ? (docSnap.data().contador || 0) : 0;
      const novo = atual + 1;
      tx.set(ref, { contador: novo }, { merge: true });
      return novo;
    });
    return `${String(novoValor).padStart(2,'0')}.${sufixo}`;
  }catch(e){
    console.error('Transação do número da CCB falhou, usando contagem simples como reserva:', e);
    let contagemHoje = 0;
    try{
      const todas = await listSims();
      contagemHoje = todas.filter(s => s.numeroCCB && s.numeroCCB.endsWith('.'+sufixo)).length;
    }catch(e2){}
    return `${String(contagemHoje + 1).padStart(2,'0')}.${sufixo}`;
  }
}

function wireWhatsMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let d = input.value.replace(/\D/g,'').slice(0,11);
    let out = d;
    if(d.length > 2) out = `(${d.slice(0,2)}) ${d.slice(2)}`;
    if(d.length > 7) out = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
    input.value = out;
  });
}
function whatsDigits(str){
  const d = String(str||'').replace(/\D/g,'');
  if(!d) return null;
  return d.startsWith('55') ? d : '55'+d;
}

// Telefone no padrão (85)99129-4450
function wireTelefoneMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let d = input.value.replace(/\D/g,'').slice(0,11);
    let out = d;
    if(d.length > 2) out = `(${d.slice(0,2)})${d.slice(2)}`;
    if(d.length > 6) out = `(${d.slice(0,2)})${d.slice(2,d.length-4)}-${d.slice(-4)}`;
    input.value = out;
  });
}

// Renda no padrão 1.500,00 (moeda com centavos)
function wireMoedaMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let d = input.value.replace(/\D/g,'');
    if(!d){ input.value=''; return; }
    d = d.padStart(3,'0');
    const centavos = d.slice(-2);
    const inteiro = Number(d.slice(0,-2)).toLocaleString('pt-BR');
    input.value = `${inteiro},${centavos}`;
  });
}

// CEP no padrão 00000-000 + busca automática de endereço (ViaCEP)
// CPF no padrão 000.000.000-00
function wireCpfMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let d = input.value.replace(/\D/g,'').slice(0,11);
    let out = d;
    if(d.length > 3) out = `${d.slice(0,3)}.${d.slice(3)}`;
    if(d.length > 6) out = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
    if(d.length > 9) out = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
    input.value = out;
  });
}

function wireCepMask(input, onFound){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let d = input.value.replace(/\D/g,'').slice(0,8);
    input.value = d.length > 5 ? `${d.slice(0,5)}-${d.slice(5)}` : d;
  });
  input.addEventListener('blur', async ()=>{
    const digits = input.value.replace(/\D/g,'');
    const statusEl = document.getElementById('cep-status');
    if(digits.length !== 8){ return; }
    if(statusEl) statusEl.textContent = 'Buscando endereço...';
    try{
      const r = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
      const j = await r.json();
      if(j.erro){
        if(statusEl) statusEl.textContent = 'CEP não encontrado — preencha manualmente.';
        return;
      }
      if(statusEl) statusEl.textContent = '✓ Endereço encontrado';
      onFound && onFound({
        rua: j.logradouro || '',
        bairro: j.bairro || '',
        cidade: j.localidade || '',
        uf: j.uf || ''
      });
    }catch(e){
      console.error('Erro ao buscar CEP:', e);
      if(statusEl) statusEl.textContent = 'Não foi possível buscar o CEP agora — preencha manualmente.';
    }
  });
}

function calcParcela(pv, taxaMensalPct, n){
  const i = taxaMensalPct/100;
  if(i <= 0) return pv/n;
  return pv * i / (1 - Math.pow(1+i, -n));
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.style.maxWidth = '90%';
  t.style.textAlign = 'center';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 6000);
}
async function compressImage(dataUrl, maxW){
  return new Promise((res)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const c = document.createElement('canvas');
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = dataUrl;
  });
}

// ---------- Storage wrappers (shared = visible to owner AND client link) ----------
async function saveSim(sim){
  if(!firebaseOk){
    memStore[sim.id] = JSON.parse(JSON.stringify(sim));
    return true;
  }
  try{
    await db.collection('simulacoes').doc(sim.id).set(sim);
    return true;
  }catch(e){
    console.error('Erro saveSim:', e);
    const msg = (e && (e.message || e.toString())) || 'erro desconhecido';
    toast('Erro ao salvar: ' + msg);
    throw e;
  }
}
async function loadSim(id){
  if(!firebaseOk){
    return memStore[id] ? JSON.parse(JSON.stringify(memStore[id])) : null;
  }
  try{
    const doc = await db.collection('simulacoes').doc(id).get();
    return doc.exists ? doc.data() : null;
  }catch(e){
    console.error('Erro loadSim:', e);
    return null;
  }
}
async function listSims(){
  if(!firebaseOk){
    return Object.values(memStore)
      .map(s=>JSON.parse(JSON.stringify(s)))
      .sort((a,b)=> b.criadoEm - a.criadoEm);
  }
  try{
    const snap = await db.collection('simulacoes').orderBy('criadoEm','desc').get();
    return snap.docs.map(d=>d.data());
  }catch(e){
    console.error('Erro listSims:', e);
    return [];
  }
}

// Documentos (RG/CPF) ficam separados do registro principal da simulação,
// cada um em seu próprio registro — assim um documento grande não estoura
// o limite de tamanho e não trava os outros.
const memDocs = {};
async function saveDocumento(simId, key, data){
  if(!firebaseOk){
    memDocs[simId] = memDocs[simId] || {};
    memDocs[simId][key] = data;
    return true;
  }
  await db.collection('simulacoes').doc(simId).collection('documentos').doc(key).set(data);
  return true;
}
async function loadDocumentos(simId){
  if(!firebaseOk){
    return memDocs[simId] ? JSON.parse(JSON.stringify(memDocs[simId])) : {};
  }
  try{
    const snap = await db.collection('simulacoes').doc(simId).collection('documentos').get();
    const out = {};
    snap.forEach(d=> out[d.id] = d.data());
    return out;
  }catch(e){
    console.error('Erro loadDocumentos:', e);
    return {};
  }
}

async function deleteSim(id){
  if(!firebaseOk){
    delete memStore[id];
    delete memDocs[id];
    return true;
  }
  const docsMap = ['rgFrente','rgVerso','cpfFrente','comprovanteResidencia','comprovanteRenda'];
  for(const k of docsMap){
    try{ await db.collection('simulacoes').doc(id).collection('documentos').doc(k).delete(); }catch(e){}
  }
  await db.collection('simulacoes').doc(id).delete();
  return true;
}

async function deleteDocumento(simId, key){
  if(!firebaseOk){
    if(memDocs[simId]) delete memDocs[simId][key];
    return true;
  }
  await db.collection('simulacoes').doc(simId).collection('documentos').doc(key).delete();
  return true;
}

// ---------- Router ----------
function getRoute(){
  const h = location.hash.replace('#','');
  if(h.startsWith('cliente/')) return {view:'cliente', id:h.split('/')[1]};
  if(h.startsWith('simulacao/')) return {view:'simulacao', id:h.split('/')[1]};
  if(h.startsWith('contratar/')) return {view:'contratar', id:h.split('/')[1]};
  if(h.startsWith('detalhe/')) return {view:'detalhe', id:decodeURIComponent(h.split('/')[1]||'')};
  if(h === 'novo') return {view:'novo'};
  if(h === 'decimo-terceiro') return {view:'decimo-terceiro'};
  return {view:'painel'};
}
window.addEventListener('hashchange', render);

    await renderInner();
  }catch(e){
    document.getElementById('app').innerHTML = `
      <div class="wrap">
        <div class="card">
          <h2>Ops, algo travou</h2>
          <p class="hint">Não foi possível carregar os dados agora. Se apareceu um aviso de "Acessar dados compartilhados", toque em Permitir e tente de novo.</p>

}

      <h2 style="color:#8a5a00;">🧪 Modo de teste (dados temporários)</h2>
      <p class="hint" style="color:#8a5a00;">Você já pode testar o fluxo inteiro agora. Os dados ficam guardados só nesta sessão e somem ao fechar. Quando quiser publicar de verdade, configure o <b>firebaseConfig</b> no início do arquivo (veja o COMO-PUBLICAR.md).</p>
    </div>`;
  if(route.view === 'detalhe') body = `
    <button class="btn btn-outline" style="margin-bottom:12px;" onclick="location.hash=''">← Voltar ao painel</button>
    <div id="detalhe"><div class="card"><p class="hint">Abrindo proposta...</p></div></div>`;

  }

const INSS_2026 = [
  { limite: 1621.00, aliquota: 7.5 },
  { limite: 2902.84, aliquota: 9 },
  { limite: 4354.27, aliquota: 12 },
  { limite: 8475.55, aliquota: 14 }
];

function calcularInss2026(base){
  const salario = Math.max(0, Number(base) || 0);
  let contribuicao = 0;
  let anterior = 0;
  let aliquotaNominal = 0;
  for(const faixa of INSS_2026){
    const tributavel = Math.max(0, Math.min(salario, faixa.limite) - anterior);
    if(tributavel > 0){
      contribuicao += tributavel * (faixa.aliquota / 100);
      aliquotaNominal = faixa.aliquota;
    }
    anterior = faixa.limite;
    if(salario <= faixa.limite) break;
  }
  contribuicao = Math.round((contribuicao + 0.00000001) * 100) / 100;
  return {
    valor: contribuicao,
    aliquotaNominal,
    aliquotaEfetiva: salario ? (contribuicao / salario) * 100 : 0
  };
}

function arredondarCentavos(valor){
  return Math.round((Number(valor) + 0.00000001) * 100) / 100;
}

function onCalcularDecimoTerceiro(){
  const salario = parseMoedaBR(document.getElementById('d13-salario').value);
  const parcelaEscolhida = document.getElementById('d13-parcela').value;
  const meses = Math.max(1, Math.min(12, Math.floor(Number(document.getElementById('d13-meses').value) || 1)));
  const taxaEl = document.getElementById('d13-taxa');
  const taxaInformada = Number(taxaEl.value);
  const taxa = Number.isFinite(taxaInformada) ? Math.max(10, taxaInformada) : 10;
  const aplicarInss = document.getElementById('d13-aplicar-inss').checked;
  const resultado = document.getElementById('d13-resultado');

  taxaEl.value = taxa.toFixed(2).replace('.00','');
  document.getElementById('d13-meses').value = meses;
  if(!salario){
    resultado.innerHTML = '';
    toast('Informe o salário bruto para calcular.');
    return;
  }

  const primeira = arredondarCentavos(salario * 0.5);
  const inss = calcularInss2026(salario);
  const inssAplicado = aplicarInss ? inss.valor : 0;
  const segunda = arredondarCentavos(Math.max(0, salario - primeira - inssAplicado));
  const parcelaFutura = parcelaEscolhida === 'segunda' ? segunda : primeira;
  const percentualTotal = (taxa / 100) * meses;
  const custo = arredondarCentavos(parcelaFutura * percentualTotal);
  const valorLiberado = arredondarCentavos(parcelaFutura - custo);
  const cetMensal = valorLiberado > 0
    ? (Math.pow(parcelaFutura / valorLiberado, 1 / meses) - 1) * 100
    : 0;

async function viewPainel(){
  const sims = await listSims();
  window.__simsCache = Object.fromEntries(sims.map(s=>[s.id,s]));
  if(sims.length===0){
    return `<div class="card"><div class="empty">Nenhuma simulação criada ainda.<br>Toque em <b>Nova simulação</b> para começar.</div></div>`;
  }
  const statusLabel = (s)=>{
    if(s.aceite) return `<span class="badge badge-ok">CCB assinada</span>`;
    if(s.status==='aguardando_cliente'){
      const completos = s.documentosEnviados && s.documentosEnviados.length>=4;
      return completos
        ? `<span class="badge badge-wait">Aguardando assinatura</span>`
        : `<span class="badge badge-pending">Pendente</span>`;
    }
    if(s.status==='contratando') return `<span class="badge badge-pending">Pendente</span>`;
    return `<span class="badge badge-wait">Simulação</span>`;
  };
  let rows = sims.map(s=>{
    const extra = s.aceite ? `<div class="sub" style="color:var(--ok);font-weight:700;cursor:pointer;text-decoration:underline;" onclick="abrirPaginaDetalhe('${s.id}')">📁 Documentos e CCB prontos para baixar</div>` : '';
    const resumo = isDecimoTerceiro(s)
      ? `<span class="badge badge-wait">13º</span> ${brl(s.valor)} liberado · quitação de ${brl(s.parcela)}`
      : `${brl(s.valor)} · ${s.prazo}x de ${brl(s.parcela)}`;
    return `
    <div class="sim-item">
      <div>
        <div class="nm">${s.cliente || 'Cliente'}</div>
        <div class="sub">${resumo} ${statusLabel(s)}</div>
        ${extra}
      </div>
      <button class="btn btn-outline btn-sm" onclick="abrirPaginaDetalhe('${s.id}')">Ver</button>
    </div>`;
  }).join('');
  return `<div class="card"><h2>Simulações</h2>${rows}</div>`;
}

  const linhas = docsMap.map(([key,label])=>{
    const d = docs[key];
    if(!d) return `<div class="sim-item"><div><div class="nm">${label}</div><div class="sub">Não enviado</div></div></div>`;
    return `<div class="sim-item">
      <div><div class="nm">${label}</div><div class="sub">${d.nome||'arquivo'}</div></div>

async function carregarDocumentosDetalhe(simId){
  const box = document.getElementById('documentos-cliente');
  if(!box || box.dataset.simId !== simId) return;
  try{
    window.__docsCache = window.__docsCache || {};
    const docs = window.__docsCache[simId] || await loadDocumentos(simId);
    window.__docsCache[simId] = docs;
    const atual = document.getElementById('documentos-cliente');
    if(atual && atual.dataset.simId === simId) atual.innerHTML = htmlDocumentosCliente(simId, docs);
  }catch(e){
    console.error('Erro ao carregar documentos:', e);
    const atual = document.getElementById('documentos-cliente');
    if(atual && atual.dataset.simId === simId) atual.innerHTML = `<h2>Documentos do cliente</h2><p class="hint">Não foi possível carregar os arquivos agora. <button class="btn btn-outline btn-sm" onclick="carregarDocumentosDetalhe('${simId}')">Tentar novamente</button></p>`;
  }
}

    <button class="btn btn-outline" style="margin-top:10px;" onclick="abrirDetalhe('${s.id}')">Cancelar</button>

  wireMilharMask(document.getElementById('ei-valor'));

    const btn = document.getElementById('btn-salvar-inline');

    try{
      const valor = parseMilhar(document.getElementById('ei-valor').value);
      const prazo = Number(document.getElementById('ei-prazo').value);
      const taxa = Number(document.getElementById('ei-taxa').value) || getFaixa(valor || 0).taxa;

      toast('Erro ao salvar: ' + (e.message||e));
      btn.disabled = false; btn.textContent = '💾 Salvar alterações';
    }
  };
};

function dataUrlParaBlob(dataUrl){
  if(typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) return null;
  const pos = dataUrl.indexOf(',');
  if(pos < 0) return null;
  const cabecalho = dataUrl.slice(0, pos);
  const mime = (cabecalho.match(/^data:([^;,]+)/)||[])[1] || 'application/octet-stream';
  const conteudo = dataUrl.slice(pos + 1);
  const binario = cabecalho.includes(';base64') ? atob(conteudo) : decodeURIComponent(conteudo);
  const partes = [];
  for(let i=0; i<binario.length; i+=8192){
    const trecho = binario.slice(i, i+8192);
    const bytes = new Uint8Array(trecho.length);
    for(let j=0; j<trecho.length; j++) bytes[j] = trecho.charCodeAt(j);
    partes.push(bytes);
  }
  return new Blob(partes, {type:mime});
}

window.baixarDocumento = function(simId, key){
  const cache = (window.__docsCache && window.__docsCache[simId]) || {};
  const d = cache[key];
  if(!d){ toast('Documento não encontrado.'); return; }
  try{
    const blob = dataUrlParaBlob(d.dataUrl);
    const href = blob ? URL.createObjectURL(blob) : d.dataUrl;
    if(!href) throw new Error('Arquivo sem conteúdo');
    const a = document.createElement('a');
    a.href = href;
    a.download = d.nome || (key + (d.tipo && d.tipo.includes('pdf') ? '.pdf' : '.jpg'));
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    if(blob) setTimeout(()=>URL.revokeObjectURL(href), 60000);
  }catch(e1){
    console.error('Erro ao abrir documento:', e1);
    try{
      const w = window.open(d.dataUrl, '_blank');
      if(!w) throw new Error('Abertura bloqueada pelo navegador');
    }catch(e2){ toast('Não foi possível abrir este documento. Tente novamente.'); }
  }
};

// Tenta baixar o PDF; se o navegador/preview bloquear o download,
// tenta abrir em nova aba; se tudo falhar, mostra o erro real.
function salvarOuAbrirPdf(doc, filename){
  try{
    doc.save(filename);
    return true;
  }catch(e1){
    console.warn('Download direto falhou, tentando abrir em nova aba:', e1);
    try{
      const blobUrl = doc.output('bloburl');
      const w = window.open(blobUrl, '_blank');
      if(!w){ throw new Error('Pop-up bloqueado pelo navegador'); }
      return true;
    }catch(e2){
      console.error('Erro ao gerar PDF:', e2);
      const msg = (e2 && (e2.message || e2.toString())) || 'erro desconhecido';
      toast('Não foi possível abrir o PDF: ' + msg);
      return false;
    }
  }
}

function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

let __vigiaTimer = null;
function iniciarVigiaAssinatura(id){
  if(__vigiaTimer) clearInterval(__vigiaTimer);
  __vigiaTimer = setInterval(async ()=>{
    const container = document.getElementById('link-final');
    if(!container){ clearInterval(__vigiaTimer); __vigiaTimer = null; return; } // saiu da tela
    try{
      const s = await loadSim(id);
      if(s && s.aceite){
        clearInterval(__vigiaTimer); __vigiaTimer = null;
        container.innerHTML = `
          <div class="card final-ok">
            ✅ Documento assinado · CCB assinada · Cliente concluiu com foto às ${fmtTimestamp(s.aceite.timestamp)}
          </div>
          <div class="card">
            <button class="btn btn-primary" onclick="gerarPDF('${s.id}')">Baixar CCB em PDF</button>
            <button class="btn btn-outline" style="margin-top:10px;" onclick="location.hash=''">Voltar ao painel</button>
          </div>`;
        toast('O cliente assinou! CCB pronta pra baixar.');
      }
    }catch(e){
      console.warn('Vigia de assinatura: erro ao verificar', e);
    }
  }, 6000);
}

function wireContratarEvents(id){

    if(!document.getElementById('dc-rua').value) document.getElementById('dc-rua').value = endereco.rua;
    if(!document.getElementById('dc-bairro').value) document.getElementById('dc-bairro').value = endereco.bairro;
    document.getElementById('dc-cidade').value = endereco.cidade;
    document.getElementById('dc-uf').value = endereco.uf;
  });

  const btnAvancar = document.getElementById('btn-avancar');
  if(btnAvancar){
    btnAvancar.onclick = async ()=>{
      const cpf = document.getElementById('dc-cpf').value.trim();
      if(!cpf){ toast('Informe o CPF do cliente.'); return; }
      btnAvancar.disabled = true; btnAvancar.textContent = 'Salvando...';
      try{
        const s = await loadSim(id);
        if(!s) throw new Error('sim não encontrada');
        const enderecoEstruturado = {
          cep: document.getElementById('dc-cep').value.trim(),
          rua: document.getElementById('dc-rua').value.trim(),
          numero: document.getElementById('dc-numero').value.trim(),
          bairro: document.getElementById('dc-bairro').value.trim(),
          complemento: document.getElementById('dc-complemento').value.trim(),
          cidade: document.getElementById('dc-cidade').value.trim(),
          uf: document.getElementById('dc-uf').value.trim().toUpperCase(),
        };
        const enderecoTexto = [
          enderecoEstruturado.rua && (enderecoEstruturado.rua + (enderecoEstruturado.numero ? ', '+enderecoEstruturado.numero : '')),
          enderecoEstruturado.complemento,
          enderecoEstruturado.bairro,
          (enderecoEstruturado.cidade || enderecoEstruturado.uf) && `${enderecoEstruturado.cidade}${enderecoEstruturado.uf?'/'+enderecoEstruturado.uf:''}`,
          enderecoEstruturado.cep && `CEP ${enderecoEstruturado.cep}`
        ].filter(Boolean).join(', ');
        s.dadosCliente = {
          cpf,
          rg: document.getElementById('dc-rg').value.trim(),
          nascimento: document.getElementById('dc-nasc').value,
          nomePai: document.getElementById('dc-pai').value.trim(),
          nomeMae: document.getElementById('dc-mae').value.trim(),
          profissao: document.getElementById('dc-prof').value.trim(),
          renda: document.getElementById('dc-renda').value.trim(),
          escolaridade: document.getElementById('dc-escola').value.trim(),
          telefone: document.getElementById('dc-tel').value.trim(),
          email: document.getElementById('dc-email').value.trim(),
          endereco: enderecoTexto,
          enderecoEstruturado,
          pix: document.getElementById('dc-pix').value.trim(),
        };
        await saveSim(s);
        document.getElementById('step2').style.display = 'block';
        document.getElementById('step2').scrollIntoView({behavior:'smooth'});
        toast('Dados salvos. Agora anexe os documentos.');
      }catch(e){
        toast('Não deu pra salvar os dados. Tente novamente.');
      }
      btnAvancar.disabled = false; btnAvancar.textContent = 'Avançar';
    };
  }

  const btnConcluir = document.getElementById('btn-concluir');
  if(btnConcluir){
    btnConcluir.onclick = async ()=>{
      btnConcluir.disabled = true;
      btnConcluir.textContent = 'Enviando...';
      try{
        const s = await loadSim(id);
        if(!s) throw new Error('sim não encontrada');
        const campos = [
          ['doc-rg-frente','rgFrente'], ['doc-rg-verso','rgVerso'],
          ['doc-cpf-frente','cpfFrente'], ['doc-residencia','comprovanteResidencia'],
          ['doc-comprovante-renda','comprovanteRenda']
        ];
        const enviados = [];
        const falhas = [];
        for(const [elId,key] of campos){
          const el = document.getElementById(elId);
          if(el.files && el.files[0]){
            try{
              const file = el.files[0];
              const dataUrl = await fileToDataUrl(file);
              const isImage = file.type.startsWith('image/');
              const finalDataUrl = isImage ? await compressImage(dataUrl, 900) : dataUrl;
              if(finalDataUrl.length > 900000){
                falhas.push(`${key} (arquivo muito grande — envie um menor)`);
                continue;
              }
              await saveDocumento(id, key, { dataUrl: finalDataUrl, tipo: file.type, nome: file.name });
              enviados.push(key);
            }catch(errDoc){
              console.error('Erro no documento', key, errDoc);

function wireFaixaSugestao(){
  const valorEl = document.getElementById('f-valor');
  const taxaEl = document.getElementById('f-taxa');
  const prazoEl = document.getElementById('f-prazo');
  const hintEl = document.getElementById('faixa-hint');
  let taxaTocada = false, prazoTocado = false;
  taxaEl.addEventListener('input', ()=>{ taxaTocada = true; });
  prazoEl.addEventListener('change', ()=>{ prazoTocado = true; });
  valorEl.addEventListener('input', ()=>{
    const valor = parseMilhar(valorEl.value);
    if(!valor){ hintEl.textContent=''; return; }
    const f = getFaixa(valor);
    hintEl.textContent = `💡 Sugestão pra essa faixa: ${f.prazoTexto.toLowerCase()}, ${f.taxa}% a.m.`;
    if(!taxaTocada) taxaEl.value = f.taxa;
    if(!prazoTocado) prazoEl.value = f.prazoMax;
  });
}

function wireMilharMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    const digits = input.value.replace(/\D/g,'');
    input.value = digits ? Number(digits).toLocaleString('pt-BR') : '';
  });
}
function parseMilhar(str){
  return Number(String(str||'').replace(/\D/g,''));
}
function parseMoedaBR(str){
  const digits = String(str||'').replace(/\D/g,'');
  return digits ? Number(digits) / 100 : 0;
}

async function capturarFoto(id){
  const video = document.getElementById('video');

  canvas.getContext('2d').drawImage(video,0,0);
  const foto = canvas.toDataURL('image/jpeg', 0.85);
  if(__stream){ __stream.getTracks().forEach(t=>t.stop()); __stream=null; }
  const fotoComprimida = await compressImage(foto, 480);
  window.__fotoTemp = fotoComprimida;
  const box = document.getElementById('fluxo-assinatura');
  box.innerHTML = `

async function capturarGeo(id){
  const status = document.getElementById('geo-status');
  if(!navigator.geolocation){
    status.textContent = 'Geolocalização não suportada neste navegador.';
    window.__geoTemp = null;
    finalizarAssinatura(id);
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const geo = {lat: pos.coords.latitude, lng: pos.coords.longitude, precisao: pos.coords.accuracy};
    let endereco = '';
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${geo.lat}&lon=${geo.lng}`);
      const j = await r.json();
      endereco = j.display_name || '';
    }catch(e){ /* geocoding pode falhar por CORS/rede - segue sem endereço */ }
    status.textContent = `Localização obtida: ${geo.lat.toFixed(5)}, ${geo.lng.toFixed(5)}${endereco ? ' — '+endereco : ''}`;
    window.__geoTemp = {geo, endereco};
    finalizarAssinatura(id);
  }, (err)=>{
    status.textContent = `Não foi possível obter a localização (${err.message}). Continuando sem geolocalização.`;
    window.__geoTemp = null;
    finalizarAssinatura(id);
  }, {enableHighAccuracy:true, timeout:12000});
}

    </div>`;
}

function dataUrlParaBytes(dataUrl){
  const partes = String(dataUrl||'').split(',');
  if(partes.length < 2) throw new Error('Arquivo anexado inválido.');
  const binario = atob(partes[1]);
  const bytes = new Uint8Array(binario.length);
  for(let i=0;i<binario.length;i++) bytes[i] = binario.charCodeAt(i);
  return bytes;
}

async function salvarCCBComDocumentos(doc, documentos, filename){
  const anexos = [
    ['rgFrente','RG - Frente'],
    ['rgVerso','RG - Verso'],
    ['cpfFrente','CPF - Frente'],
    ['comprovanteResidencia','Comprov. Residencia'],
    ['comprovanteRenda','Comprov. Renda']
  ].filter(([key])=> documentos && documentos[key] && documentos[key].dataUrl);

  if(!anexos.length){
    salvarOuAbrirPdf(doc, filename);
    return;
  }
  if(!window.PDFLib){
    throw new Error('Biblioteca para juntar os documentos não carregou. Verifique a internet e tente novamente.');
  }

  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const pacote = await PDFDocument.create();
  const ccb = await PDFDocument.load(doc.output('arraybuffer'));
  const paginasCCB = await pacote.copyPages(ccb, ccb.getPageIndices());
  paginasCCB.forEach(p=>pacote.addPage(p));
  const fonte = await pacote.embedFont(StandardFonts.HelveticaBold);
  const falhas = [];

  for(const [key,label] of anexos){
    const anexo = documentos[key];
    try{
      const bytes = dataUrlParaBytes(anexo.dataUrl);
      const tipo = String(anexo.tipo||'').toLowerCase();
      const nome = String(anexo.nome||'').toLowerCase();
      if(tipo.includes('pdf') || nome.endsWith('.pdf')){
        const pdfAnexo = await PDFDocument.load(bytes, {ignoreEncryption:true});
        const paginas = await pacote.copyPages(pdfAnexo, pdfAnexo.getPageIndices());
        paginas.forEach(p=>pacote.addPage(p));
      }else{
        const imagem = String(anexo.dataUrl).startsWith('data:image/png')
          ? await pacote.embedPng(bytes)
          : await pacote.embedJpg(bytes);
        const pagina = pacote.addPage([595.28,841.89]);
        pagina.drawText(label, {x:40,y:805,size:13,font:fonte,color:rgb(0.08,0.08,0.08)});
        pagina.drawLine({start:{x:40,y:792},end:{x:555,y:792},thickness:1.5,color:rgb(0.89,0.61,0)});
        const escala = Math.min(515/imagem.width, 730/imagem.height);
        const largura = imagem.width*escala;
        const altura = imagem.height*escala;
        pagina.drawImage(imagem, {x:(595.28-largura)/2,y:35+(730-altura)/2,width:largura,height:altura});
      }
    }catch(e){
      console.error('Erro ao incorporar documento '+key+':', e);
      falhas.push(label);
    }
  }

  const bytesFinais = await pacote.save();
  const blob = new Blob([bytesFinais], {type:'application/pdf'});
  const blobUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = blobUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(blobUrl), 60000);
  if(falhas.length){
    toast('O PDF foi gerado, mas não foi possível incluir: '+falhas.join(', ')+'.');
  }
}

    ['Parcela antecipada', s.parcela13==='segunda' ? '2ª parcela' : '1ª parcela'],
    ['INSS calculado', brl(s.inssCalculado)],
    ['INSS aplicado', brl(s.inssAplicado)],
    ['Alíquota efetiva do INSS', (s.aliquotaInssEfetiva||0).toFixed(2) + '%'],
    ['Valor do crédito liberado', brl(s.valor)],
    ['Valor para quitação', brl(s.parcela)],
    ['Vencimento estimado', fmtDate(s.dataPrimeira)],
    ['Taxa sobre o valor da parcela', s.taxa + '% a.m.'],
    ['Custo da antecipação', brl(s.custoAntecipacao)],
    ['CET', (s.cet||0).toFixed(2) + '% a.m. (' + (s.cetAnual? s.cetAnual.toFixed(2):'-') + '% a.a. aprox.)']
  ] : [
    ['Cliente', s.cliente],
    ['Valor do crédito', brl(s.valor)],
    ['Prazo', s.prazo + ' parcelas mensais'],
    ['Valor da parcela', brl(s.parcela)],
    ['Data da 1ª parcela', fmtDate(s.dataPrimeira)],
    ['Data da última parcela', fmtDate(s.dataUltima)],
    ['Taxa de juros', s.taxa + '% a.m.'],
    ['CET', s.cet + '% a.m. (' + (s.cetAnual? s.cetAnual.toFixed(2):'-') + '% a.a. aprox.)'],
    ['Total a pagar (estimado)', brl(s.parcela*s.prazo)]
  ];
  linhas.forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); doc.text(k+':', 40, y);
    doc.setFont('helvetica','normal'); doc.text(String(v), 220, y);
    y += 18;
  });

  y += 8;
  doc.setFont('helvetica','italic'); doc.setFontSize(9);
  const clausula = isDecimoTerceiro(s)
    ? `Operação de antecipação da ${s.parcela13==='segunda'?'segunda':'primeira'} parcela do 13º salário, com desconto de ${s.taxa}% ao mês aplicado diretamente sobre o valor da parcela pelo período de ${s.mesesAntecipacao} ${s.mesesAntecipacao===1?'mês':'meses'}. O cálculo da segunda parcela considera o INSS informado nesta CCB e pode variar por IRRF ou ajustes da folha. Em caso de atraso, incidirá multa moratória de R$ ${CONFIG.multaDia.toFixed(2)} por dia, sem prejuízo dos demais encargos contratuais aplicáveis.`
    : `Taxa de juros remuneratórios: ${s.taxa}% ao mês. Em caso de atraso no pagamento de qualquer parcela, incidirá multa moratória de R$ ${CONFIG.multaDia.toFixed(2)} por dia de atraso, sem prejuízo dos demais encargos contratuais aplicáveis.`;
  const clausulaLines = doc.splitTextToSize(clausula, pageW-80);
  doc.text(clausulaLines, 40, y);
  y += clausulaLines.length*12 + 10;

  const aviso = 'Estas condições estão sujeitas à análise de crédito do banco/instituição financeira parceira e podem sofrer alteração após a avaliação cadastral. Este documento é uma proposta/registro interno da Crediti Soluções Financeiras e não substitui a formalização contratual definitiva junto à instituição financeira responsável pela operação.';
  const avisoLines = doc.splitTextToSize(aviso, pageW-80);
  doc.text(avisoLines, 40, y);
  y += avisoLines.length*12 + 16;

  // ---- Dados pessoais do cliente ----
  if(s.dadosCliente){
    if(y > 600){ doc.addPage(); y = 40; }
    const d = s.dadosCliente;
    doc.setDrawColor(20,20,20); doc.setLineWidth(1);
    doc.line(40, y, pageW-40, y); y += 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('DADOS DO CLIENTE', 40, y); y += 16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    const pessoais = [
      ['CPF', d.cpf||'-'], ['RG', d.rg||'-'],
      ['Data de nascimento', d.nascimento ? fmtDate(d.nascimento) : '-'],
      ['Nome do pai', d.nomePai||'-'], ['Nome da mãe', d.nomeMae||'-'],
      ['Profissão', d.profissao||'-'], ['Renda mensal', d.renda ? ('R$ '+d.renda) : '-'],
      ['Escolaridade', d.escolaridade||'-'],
      ['Telefone', d.telefone||'-'], ['E-mail', d.email||'-'],
      ['Endereço', d.endereco||'-'], ['Chave Pix', d.pix||'-'],
    ];
    pessoais.forEach(([k,v])=>{
      if(y > 760){ doc.addPage(); y = 40; }
      doc.setFont('helvetica','bold'); doc.text(k+':', 40, y);
      doc.setFont('helvetica','normal');
      const vLines = doc.splitTextToSize(String(v), pageW-260);
      doc.text(vLines, 220, y);
      y += Math.max(15, vLines.length*12);
    });
    y += 8;
  }

  // Os documentos reais serão acrescentados depois da CCB, página por página.
  const documentosCliente = await loadDocumentos(s.id);

  if(y > 620){ doc.addPage(); y = 40; }
  doc.setDrawColor(20,20,20); doc.setLineWidth(1);
  doc.line(40, y, pageW-40, y);
  y += 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('ASSINATURA DIGITAL DO CLIENTE', 40, y);
  y += 14;

  if(s.aceite){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.text(`Aceite registrado em: ${fmtTimestamp(s.aceite.timestamp)}`, 40, y); y+=14;
    if(s.aceite.geo){
      doc.text(`Coordenadas: ${fmtCoord(s.aceite.geo.lat,6)}, ${fmtCoord(s.aceite.geo.lng,6)} (precisão ~${Math.round(Number(s.aceite.geo.precisao)||0)}m)`, 40, y); y+=14;
    }
    if(s.aceite.endereco){
      const endLines = doc.splitTextToSize('Endereço aproximado: '+s.aceite.endereco, pageW-80);
      doc.text(endLines, 40, y); y += endLines.length*12+6;
    }
    if(s.aceite.foto){
      try{
        if(y > 620){ doc.addPage(); y = 40; }
        doc.addImage(s.aceite.foto, 'JPEG', 40, y, 140, 140);
        y += 152;
      }catch(e){}
    }
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.text('Proposta ainda não assinada pelo cliente.', 40, y); y+=14;
  }

  await salvarCCBComDocumentos(doc, documentosCliente, `CCB_e_Documentos_${isDecimoTerceiro(s)?'Antecipacao_13':'CDC'}_Crediti_${(s.cliente||'cliente').replace(/\s+/g,'_')}.pdf`);
  }catch(e){
    console.error('Erro ao montar CCB em PDF:', e);
    toast('Erro ao gerar PDF: ' + (e.message||e));
  }
};

window.addEventListener('unhandledrejection', (ev)=>{
  console.error('Erro não tratado:', ev.reason);
});

render();
</script>
</body>
</html>
