    <style>
      html.splash-active,
      html.splash-active body {
        margin: 0;
        background: #FDCA01;
      }

      .initial-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 24px;
        background: #FDCA01;
        color: #111111;
        font-family: Montserrat, Arial, sans-serif;
        text-align: center;
      }

      .initial-splash strong {
        font-size: clamp(38px, 11vw, 58px);
        font-weight: 900;
        line-height: 1;
      }

      .initial-splash small {
        font-size: 14px;
        font-weight: 600;
      }

      .initial-splash i {
        width: 24px;
        height: 24px;
        margin-top: 14px;
        border: 3px solid rgba(17, 17, 17, 0.22);
        border-top-color: #111111;
        border-radius: 50%;
        animation: initial-spin 700ms linear infinite;
      }

      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-splash" role="status" aria-label="Abrindo a Crediti">

        <i aria-hidden="true"></i>
