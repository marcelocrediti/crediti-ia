name: Instalar arquivos Android

on:
  push:
    branches: [main]
    paths: [android-publish-2.tgz]

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar arquivos Android
        run: |
          tar -xzf android-publish-2.tgz
          rm -f android-publish.tgz android-publish-2.tgz

      - name: Salvar projeto Android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepara app Android e política de privacidade"
          git push
